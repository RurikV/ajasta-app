---
# Deploy Ajasta applications on Kubernetes cluster
# This playbook deploys the Ajasta backend and frontend using Helm charts
# Prerequisites: Kubernetes cluster must be bootstrapped (k8s-bootstrap.yml)

- name: Deploy Ajasta Applications to Kubernetes
  hosts: k8s-master
  become: false
  gather_facts: false
  vars:
    # Namespace configuration - use 'production' or 'staging' via extra-vars
    # Example: ansible-playbook deploy-apps.yml -e app_namespace=production
    app_namespace: "{{ app_namespace_override | default('production') }}"

    # Docker registry configuration
    docker_registry: "{{ lookup('env', 'CI_REGISTRY') | default('registry.gitlab.com', true) }}"
    project_path: "{{ lookup('env', 'CI_PROJECT_PATH') | default('vladimirryrik/ajasta-app', true) }}"
    docker_image_tag: "{{ lookup('env', 'CI_COMMIT_SHA') | default('latest', true) }}"

    # Image names (lowercase for Docker registry compatibility)
    backend_image: "{{ docker_registry }}/{{ project_path | lower }}/backend"
    frontend_image: "{{ docker_registry }}/{{ project_path | lower }}/frontend"

    # Helm chart configuration
    helm_chart_path: "{{ playbook_dir }}/../helm/ajasta-app"
    helm_release_name: "ajasta-app"

    # Ingress configuration
    ingress_host: "{{ lookup('env', 'K8S_INGRESS_HOST') | default('', true) }}"

  pre_tasks:
    - name: Display deployment configuration
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Ajasta Application Deployment"
          - "=========================================="
          - "Namespace: {{ app_namespace }}"
          - "Backend Image: {{ backend_image }}:{{ docker_image_tag }}"
          - "Frontend Image: {{ frontend_image }}:{{ docker_image_tag }}"
          - "Helm Release: {{ helm_release_name }}"
          - "Ingress Host: {{ ingress_host | default('default/catch-all') }}"
          - "=========================================="

    - name: Ensure KUBECONFIG is set
      ansible.builtin.set_fact:
        kubeconfig_path: "/etc/kubernetes/admin.conf"
      failed_when: false

    - name: Verify KUBECONFIG exists
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: kubeconfig_stat
      failed_when: not kubeconfig_stat.stat.exists

    - name: Test cluster connectivity
      ansible.builtin.shell: kubectl get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: cluster_test
      changed_when: false
      until: cluster_test.rc == 0
      retries: 10
      delay: 5

    - name: Verify all nodes are ready
      ansible.builtin.shell: kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: nodes_ready
      changed_when: false
      until: nodes_ready.stdout.split() | select('match', '^True$') | list | length == nodes_ready.stdout.split() | length
      retries: 20
      delay: 10
      failed_when: false

    - name: Display cluster connection status
      ansible.builtin.debug:
        msg: "✅ Connected to Kubernetes cluster with {{ nodes_ready.stdout.split() | length }} nodes"

  tasks:
    - name: Ensure application namespace exists
      ansible.builtin.shell: |
        kubectl create namespace {{ app_namespace }} || true
        kubectl get namespace {{ app_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: namespace_create
      changed_when: false

    # Secrets will be created by Helm with proper labels
    # - name: Create database secret
    #   ansible.builtin.shell: |
    #     kubectl -n {{ app_namespace }} create secret generic postgres-secret \
    #       --from-literal=postgres-password="{{ lookup('env', 'POSTGRES_PASSWORD') | default('changeme', true) }}" \
    #       --from-literal=password="{{ lookup('env', 'POSTGRES_PASSWORD') | default('changeme', true) }}" || \
    #     kubectl -n {{ app_namespace }} patch secret postgres-secret -p '{"data":{"postgres-password":"'"$(echo -n "{{ lookup('env', 'POSTGRES_PASSWORD') | default('changeme', true) }}" | base64)"'"}}'
    #   environment:
    #     KUBECONFIG: "{{ kubeconfig_path }}"
    #   register: postgres_secret
    #   changed_when: false

    # - name: Create JWT secret
    #   ansible.builtin.shell: |
    #     kubectl -n {{ app_namespace }} create secret generic jwt-secret \
    #       --from-literal=jwtsecret="{{ lookup('env', 'JWT_SECRET') | default('changeme', true) }}" || true
    #   environment:
    #     KUBECONFIG: "{{ kubeconfig_path }}"
    #   register: jwt_secret
    #   changed_when: false

    # - name: Create AWS S3 secret (optional)
    #   ansible.builtin.shell: |
    #     kubectl -n {{ app_namespace }} create secret generic aws-s3-secret \
    #       --from-literal=awsAccessKeyId="{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}" \
    #       --from-literal=awsSecretAccessKey="{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}" \
    #       --from-literal=awsS3Bucket="{{ lookup('env', 'AWS_S3_BUCKET') | default('', true) }}" || true
    #   environment:
    #     KUBECONFIG: "{{ kubeconfig_path }}"
    #   register: aws_s3_secret
    #   changed_when: false
    #   when: lookup('env', 'AWS_ACCESS_KEY_ID') | default('', true) | length > 0

    # - name: Create Stripe secret (optional)
    #   ansible.builtin.shell: |
    #     kubectl -n {{ app_namespace }} create secret generic stripe-secret \
    #       --from-literal=stripePublicKey="{{ lookup('env', 'STRIPE_PUBLIC_KEY') }}" \
    #       --from-literal=stripeSecretKey="{{ lookup('env', 'STRIPE_SECRET_KEY') }}" || true
    #   environment:
    #     KUBECONFIG: "{{ kubeconfig_path }}"
    #   register: stripe_secret
    #   changed_when: false
    #   when: lookup('env', 'STRIPE_PUBLIC_KEY') | default('', true) | length > 0

    - name: Copy Helm chart to master node
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../helm/ajasta-app/"
        dest: "/tmp/ajasta-app-chart/"
        delete: false
        recursive: true
      become: true

    - name: Deploy application with Helm
      ansible.builtin.shell: |
        /usr/local/bin/helm upgrade --install {{ helm_release_name }} /tmp/ajasta-app-chart \
          --namespace {{ app_namespace }} \
          --set namespace.create=false \
          --set global.namespace={{ app_namespace }} \
          --set backend.enabled=true \
          --set backend.image.repository={{ backend_image }} \
          --set backend.image.tag={{ docker_image_tag }} \
          --set backend.image.pullPolicy=Always \
          --set backend.replicas=1 \
          --set backend.service.type=ClusterIP \
          --set backend.service.port=8090 \
          --set backend.database.password="{{ lookup('env', 'POSTGRES_PASSWORD') | default('changeme', true) }}" \
          --set backend.secrets.jwtSecret="{{ lookup('env', 'JWT_SECRET') | default('changeme', true) }}" \
          --set frontend.enabled=true \
          --set frontend.image.repository={{ frontend_image }} \
          --set frontend.image.tag={{ docker_image_tag }} \
          --set frontend.image.pullPolicy=Always \
          --set frontend.replicas=1 \
          --set frontend.service.type=ClusterIP \
          --set frontend.service.port=80 \
          --set postgres.enabled=true \
          --set postgres.auth.password="{{ lookup('env', 'POSTGRES_PASSWORD') | default('changeme', true) }}" \
          --set ingress.enabled=true \
          --set ingress.className=nginx \
          --wait \
          --timeout 10m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: helm_deploy
      failed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        msg: "✅ Application deployed with Helm release {{ helm_release_name }}"
      when: helm_deploy.rc == 0

    - name: Pause for cluster stabilization after Helm deployment
      ansible.builtin.pause:
        seconds: 10

    - name: Verify API server is responsive after deployment
      ansible.builtin.shell: kubectl get endpoints -n kube-system kube-dns
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_health_check
      changed_when: false
      until: api_health_check.rc == 0
      retries: 10
      delay: 5

    - name: Wait for deployments to be ready
      ansible.builtin.shell: |
        kubectl wait --for=condition=available --timeout=300s deployment/ajasta-backend deployment/ajasta-frontend -n {{ app_namespace }} || true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: deploy_wait
      changed_when: false
      failed_when: false

    - name: Get deployment status with retry logic
      ansible.builtin.shell: kubectl get deployments -n {{ app_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: deployments
      changed_when: false
      until: deployments.rc == 0
      retries: 10
      delay: 5

    - name: Display deployment information
      ansible.builtin.debug:
        msg: "{{ deployments.stdout_lines }}"

    - name: Get all pods in namespace
      ansible.builtin.shell: kubectl get pods -n {{ app_namespace }} -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: pods_info
      changed_when: false
      until: pods_info.rc == 0
      retries: 5
      delay: 3

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pods_info.stdout_lines }}"

    - name: Get ingress information
      ansible.builtin.shell: kubectl get ingress -n {{ app_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: ingress_info
      changed_when: false
      failed_when: false
      until: ingress_info.rc == 0 or ingress_info.rc == 1
      retries: 5
      delay: 3

    - name: Display ingress information
      ansible.builtin.debug:
        msg: "{{ ingress_info.stdout_lines }}"
      when: ingress_info.rc == 0


  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================"
          - "✅ Application Deployment Complete!"
          - "================================================"
          - ""
          - "Application: Ajasta App"
          - "Namespace: {{ app_namespace }}"
          - "Helm Release: {{ helm_release_name }}"
          - ""
          - "Access the application:"
          - "  1. Get ingress IP: kubectl get ingress -n {{ app_namespace }}"
          - "  2. Access via: http://<ingress-ip>/"
          - "  3. API endpoint: http://<ingress-ip>/api"
          - ""
          - "Monitor pods:"
          - "  kubectl get pods -n {{ app_namespace }} -w"
          - ""
          - "View logs:"
          - "  kubectl logs -n {{ app_namespace }} -l app=ajasta-backend"
          - "  kubectl logs -n {{ app_namespace }} -l app=ajasta-frontend"
          - ""
          - "Upgrade application:"
          - "  helm upgrade {{ helm_release_name }} {{ helm_chart_path }} --namespace {{ app_namespace }}"
          - ""
