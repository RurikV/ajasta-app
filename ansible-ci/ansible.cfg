[defaults]
# Ansible Configuration for ansible-ci

# Inventory location
inventory = inventory.ini

# Roles path
roles_path = roles

# Disable host key checking (for dynamic VMs)
host_key_checking = False

# SSH configuration
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Privilege escalation
become = True
become_method = sudo
become_ask_pass = False

# Performance
pipelining = True
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Output
stdout_callback = yaml
bin_ansible_callbacks = True
display_skipped_hosts = False
display_ok_hosts = True

# Retry settings
retries = 3
timeout = 30

# Logging
log_path = ./ansible.log

# Python interpreter
interpreter_python = auto_silent

# Disable cowsay (for cleaner output)
nocows = 1

# YAML formatting
yaml_valid_extensions = .yml,.yaml,.json

# Error handling
any_errors_fatal = False
max_fail_percentage = 100

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=5 -o ServerAliveCountMax=3

[colors]
# Output colors (for readable terminal output)
highlight = white
verbose = blue
debug = dark gray
error = red
warn = bright purple
skip = cyan
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
