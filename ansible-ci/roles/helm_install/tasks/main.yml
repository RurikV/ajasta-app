---
# Install Helm package manager

- name: Check if helm is already installed
  ansible.builtin.command: command -v helm
  register: helm_check
  changed_when: false
  failed_when: false

- name: Display helm check result
  ansible.builtin.debug:
    msg: "Helm already installed: {{ helm_check.rc == 0 }}"
  when: helm_check.rc is defined

- name: Install helm when not present
  when: helm_check.rc != 0
  block:
    - name: Get system architecture
      ansible.builtin.set_fact:
        helm_arch: "{{ helm_arch_map.get(ansible_architecture | default('x86_64'), 'amd64') }}"

    - name: Download Helm binary
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: /tmp/helm.tar.gz
        mode: '0644'
        timeout: 60
      become: true

    - name: Create temporary directory for helm extraction
      ansible.builtin.file:
        path: /tmp/helm
        state: directory
        mode: '0755'
      become: true

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp/helm
        remote_src: true
      become: true

    - name: Install helm to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/helm/linux-{{ helm_arch }}/helm
        dest: /usr/local/bin/helm
        mode: '0755'
        remote_src: true
      become: true

    - name: Cleanup helm installation files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/helm.tar.gz
        - /tmp/helm
      become: true

    - name: Verify helm installation
      ansible.builtin.command: helm version
      register: helm_verify
      changed_when: false
      become: true

    - name: Display helm version
      ansible.builtin.debug:
        msg: "{{ helm_verify.stdout_lines }}"
