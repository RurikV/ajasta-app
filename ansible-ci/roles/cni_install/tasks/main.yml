---
# Install a simple CNI (Flannel) and make the cluster schedulable on a single control-plane node.
# This role runs on all k8s hosts but only performs actions on the master.
# Flannel is chosen over Calico for better stability and resilience to API server failures.

- name: Determine kubeconfig path (prefer admin.conf)
  ansible.builtin.set_fact:
    cni_kubeconfig: "/etc/kubernetes/admin.conf"

- name: Check if running on master host
  ansible.builtin.set_fact:
    is_master_host: "{{ (inventory_hostname == 'k8s-master') | bool }}"

- name: Skip non-master hosts
  ansible.builtin.meta: noop
  when: not is_master_host

- name: Ensure kubectl is available on master
  ansible.builtin.command: command -v kubectl
  register: kubectl_cmd
  changed_when: false
  when: is_master_host

- name: Fail if kubectl is not available on master
  ansible.builtin.fail:
    msg: "kubectl is not available on k8s-master; kubeadm_init may not have completed."
  when: is_master_host and kubectl_cmd.rc != 0

- name: Check if Flannel namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    # Use -o name to avoid Jinja/go-template brace conflicts
    KUBECONFIG={{ cni_kubeconfig }} kubectl get ns kube-flannel -o name 2>/dev/null || true
  args:
    executable: /bin/bash
  register: flannel_ns
  changed_when: false
  when: is_master_host

- name: Apply Flannel CNI (if missing)
  ansible.builtin.shell: |
    set -euo pipefail
    # Retry up to 5 times with 10s delay if API server is not ready
    for i in {1..5}; do
      if KUBECONFIG={{ cni_kubeconfig }} kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/refs/heads/master/Documentation/kube-flannel.yml 2>&1; then
        exit 0
      fi
      echo "Attempt $i failed, retrying in 10s..."
      sleep 10
    done
    exit 1
  args:
    executable: /bin/bash
  register: flannel_apply
  failed_when: false
  when: is_master_host and (flannel_ns.stdout | default('')) == ''

- name: Display Flannel apply result
  ansible.builtin.debug:
    msg: "{{ flannel_apply.stdout_lines | default([]) }}"
  when: is_master_host and flannel_apply is defined

- name: Fail if Flannel CNI installation failed
  ansible.builtin.fail:
    msg: |
      Failed to install Flannel CNI after 5 attempts.
      Error: {{ flannel_apply.stderr | default('Unknown error') }}

      Check:
        - kubectl get nodes
        - kubectl get pods -n kube-system
        - journalctl -u kubelet
  when:
    - is_master_host
    - flannel_apply is defined
    - flannel_apply.rc is defined
    - flannel_apply.rc != 0

- name: Remove control-plane/master NoSchedule taints (single-node friendly)
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
    KUBECONFIG={{ cni_kubeconfig }} kubectl taint nodes --all node-role.kubernetes.io/master- || true
  args:
    executable: /bin/bash
  when: is_master_host

- name: Wait for Nodes to report Ready (up to 5m)
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl wait --for=condition=Ready nodes --all --timeout=300s
  args:
    executable: /bin/bash
  register: nodes_ready
  changed_when: false
  failed_when: false
  when: is_master_host

- name: Wait for CoreDNS rollout to complete (up to 5m)
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl -n kube-system rollout status deploy/coredns --timeout=300s
  args:
    executable: /bin/bash
  register: coredns_rollout
  changed_when: false
  failed_when: false
  when: is_master_host

# ============================================================================
# POST-CNI STABILITY VERIFICATION
# Ensure control plane is still healthy after CNI installation
# ============================================================================
- name: Pause to allow cluster to stabilize after CNI installation
  ansible.builtin.pause:
    seconds: 15
  when: is_master_host

- name: Verify API server is still responsive after CNI installation
  ansible.builtin.shell: |
    set -o pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl --request-timeout=5s get --raw=/readyz >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: post_cni_apiserver_check
  changed_when: false
  retries: 20
  delay: 5
  until: post_cni_apiserver_check.rc == 0
  when: is_master_host

- name: Display post-CNI API server health status
  ansible.builtin.debug:
    msg: "✅ API server is healthy after CNI installation"
  when:
    - is_master_host
    - post_cni_apiserver_check.rc == 0

- name: Verify control plane pods are running after CNI
  ansible.builtin.shell: |
    set -o pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl get pods -n kube-system -l 'tier in (control-plane)' -o jsonpath='{.items[*].status.phase}'
  args:
    executable: /bin/bash
  register: control_plane_pods
  changed_when: false
  retries: 15
  delay: 5
  until:
    - control_plane_pods.rc == 0
    - control_plane_pods.stdout.split() | select('match', '^Running$') | list | length == control_plane_pods.stdout.split() | length
  when: is_master_host

- name: Display control plane pod status
  ansible.builtin.debug:
    msg: "✅ All control plane pods are Running after CNI installation"
  when:
    - is_master_host
    - control_plane_pods.rc == 0

- name: Verify etcd is healthy after CNI installation
  ansible.builtin.shell: |
    set -o pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl get -n kube-system pods -l component=etcd -o jsonpath='{.items[0].status.phase}'
  args:
    executable: /bin/bash
  register: post_cni_etcd_check
  changed_when: false
  retries: 10
  delay: 3
  until: post_cni_etcd_check.stdout | default('') == 'Running'
  when: is_master_host

- name: Display post-CNI etcd health status
  ansible.builtin.debug:
    msg: "✅ etcd is healthy after CNI installation"
  when:
    - is_master_host
    - post_cni_etcd_check.stdout | default('') == 'Running'

- name: Get all system pods status after CNI installation
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl get pods -n kube-system
  args:
    executable: /bin/bash
  register: post_cni_pods_status
  changed_when: false
  failed_when: false
  when: is_master_host

- name: Display all system pods status
  ansible.builtin.debug:
    msg: "{{ post_cni_pods_status.stdout_lines | default(['Unable to get pod status']) }}"
  when: is_master_host

- name: Final cluster health verification after CNI
  ansible.builtin.shell: |
    set -o pipefail
    KUBECONFIG={{ cni_kubeconfig }} kubectl get nodes
  args:
    executable: /bin/bash
  register: post_cni_nodes_check
  changed_when: false
  retries: 10
  delay: 3
  until: post_cni_nodes_check.rc == 0
  when: is_master_host

- name: Display final cluster status after CNI installation
  ansible.builtin.debug:
    msg: "{{ post_cni_nodes_check.stdout_lines | default(['Unable to get nodes']) }}"
  when: is_master_host
