---
# Install Kubernetes components (kubelet, kubeadm, kubectl)

# ----- Load required kernel modules -----
- name: Load required kernel modules for Kubernetes
  ansible.builtin.shell: |
    set -euo pipefail
    # Load required kernel modules
    modprobe br_netfilter
    modprobe overlay
    echo "Kernel modules loaded:"
    lsmod | grep -E "br_netfilter|overlay"
  args:
    executable: /bin/bash
  become: true
  register: kernel_modules
  changed_when: false
  failed_when: kernel_modules.rc != 0

- name: Ensure kernel modules persist across reboots
  ansible.builtin.copy:
    content: |
      br_netfilter
      overlay
    dest: /etc/modules-load.d/kubernetes.conf
    mode: '0644'
  become: true

- name: Configure required sysctl settings for Kubernetes
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    dest: /etc/sysctl.d/kubernetes.conf
    mode: '0644'
  become: true
  register: sysctl_config

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  become: true
  when: sysctl_config is changed
  changed_when: false

# ----- RedHat/CentOS/RHEL family -----
- name: Install Kubernetes on RedHat family
  when: ansible_os_family == 'RedHat'
  block:
    - name: Create Kubernetes repo directory
      ansible.builtin.file:
        path: /etc/yum.repos.d
        state: directory
        mode: '0755'
      become: true

    - name: Add Kubernetes YUM repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes {{ kubernetes_version }}
        baseurl: "{{ kubernetes_yum_baseurl }}"
        enabled: true
        gpgcheck: true
        gpgkey: "{{ kubernetes_yum_baseurl }}/repodata/repomd.xml.key"
        exclude:
          - kubelet*
          - kubeadm*
          - kubectl*
      become: true

    - name: Install Kubernetes packages (version {{ kubernetes_version }})
      ansible.builtin.shell: |
        set -euo pipefail
        for i in {1..3}; do
          timeout 180 dnf -y install --disableexcludes=kubernetes \
            kubelet kubeadm kubectl && exit 0
          echo "[kubernetes_install] dnf install attempt $i failed, retrying in 5s..." >&2
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      register: k8s_install_rh
      become: true
      changed_when: k8s_install_rh.rc == 0
      failed_when: k8s_install_rh.rc != 0

    - name: Verify installed Kubernetes versions
      ansible.builtin.shell: |
        kubelet --version
        kubeadm version
        kubectl version --client
      args:
        executable: /bin/bash
      register: k8s_versions_check
      changed_when: false

    - name: Enable kubelet service (don't start - kubeadm will do it)
      ansible.builtin.service:
        name: kubelet
        enabled: true
        state: stopped
      become: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

# ----- Debian/Ubuntu family -----
- name: Install Kubernetes on Debian/Ubuntu family
  when: ansible_os_family == 'Debian'
  block:
    - name: Ensure apt dependencies are installed
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes
      become: true

    - name: Download Kubernetes GPG key for version {{ kubernetes_version_base }}
      ansible.builtin.get_url:
        url: "{{ kubernetes_apt_key }}"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
        timeout: 30
      become: true

    - name: Add Kubernetes APT repository for version {{ kubernetes_version_base }}
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] {{ kubernetes_apt_url }}/ /"
        state: present
        filename: kubernetes
        update_cache: yes
      become: true

    - name: Install specific Kubernetes packages version {{ kubernetes_version }}
      ansible.builtin.apt:
        name:
          - kubelet={{ kubernetes_version }}*
          - kubeadm={{ kubernetes_version }}*
          - kubectl={{ kubernetes_version }}*
        state: present
        update_cache: yes
        force: yes
      become: true

    - name: Hold Kubernetes packages at version {{ kubernetes_version }}
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
      become: true
      when: kubernetes_hold_packages | default(true)

    - name: Enable kubelet service (don't start - kubeadm will do it)
      ansible.builtin.service:
        name: kubelet
        enabled: true
        state: stopped
      become: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

# ----- Verification -----
- name: Verify kubelet is installed
  ansible.builtin.command: command -v kubelet
  register: kubelet_cmd
  changed_when: false
  failed_when: kubelet_cmd.rc != 0

- name: Verify kubeadm is installed
  ansible.builtin.command: command -v kubeadm
  register: kubeadm_cmd
  changed_when: false
  failed_when: kubeadm_cmd.rc != 0

- name: Verify kubectl is installed
  ansible.builtin.command: command -v kubectl
  register: kubectl_cmd
  changed_when: false
  failed_when: kubectl_cmd.rc != 0

- name: Display Kubernetes package versions
  ansible.builtin.shell: |
    kubelet --version
    kubeadm version
    kubectl version --client
  args:
    executable: /bin/bash
  register: k8s_versions
  changed_when: false
  failed_when: false

- name: Show Kubernetes versions
  ansible.builtin.debug:
    msg: "{{ k8s_versions.stdout_lines }}"
