---
# Fix JWT Secret for Backend
# Generates a strong JWT secret and updates the backend deployment
# Universal - works with any dynamically assigned master IP
# FULL ROLLBACK CAPABILITY
# Usage: ansible-playbook -i inventory.ini 88-fix-jwt-secret.yml

- name: Discover Master IP
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get master IP from inventory
      ansible.builtin.shell:
        cmd: "grep 'ansible_host=' inventory.ini | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2"
      register: inventory_ip
      changed_when: false

    - name: Set master IP fact
      ansible.builtin.set_fact:
        master_ip: "{{ inventory_ip.stdout }}"

    - name: Display configuration information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "FIX JWT SECRET FOR BACKEND"
          - "================================================================"
          - ""
          - "Problem: JWT_SECRET 'change-me-production-secret-key' is too weak"
          - "Solution: Generate strong 512-bit random secret"
          - ""
          - "This will:"
          - "  1. Generate strong JWT secret (512 bits)"
          - "  2. Update backend-secret"
          - "  3. Restart backend pods"
          - "  4. Verify login works"
          - ""
          - "================================================================"

    - name: Confirm action
      ansible.builtin.pause:
        prompt: |
          This will restart the backend pod with a new JWT secret.

          Press Enter to continue or Ctrl+C to cancel.

- name: Fix JWT Secret
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    ajasta_namespace: "ajasta"
    secret_name: "backend-secret"
    deployment_name: "ajasta-backend"
    backup_dir: "/tmp/jwt-secret-fix-backup"

  tasks:
    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "FIXING JWT SECRET"
          - "================================================================"
          - ""
          - "Namespace: {{ ajasta_namespace }}"
          - "Secret: {{ secret_name }}"
          - "Deployment: {{ deployment_name }}"
          - ""

    # ============== BACKUP ==============
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Backup current secret
      ansible.builtin.shell:
        cmd: "kubectl get secret {{ secret_name }} -n {{ ajasta_namespace }} -o yaml > {{ backup_dir }}/{{ secret_name }}.yaml"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: secret_backup

    - name: Display backup status
      ansible.builtin.debug:
        msg: "✓ Backed up secret to {{ backup_dir }}/"

    # ============== GENERATE NEW JWT SECRET ==============
    - name: Generate strong JWT secret (512 bits)
      ansible.builtin.shell:
        cmd: "openssl rand -base64 64 | tr -d '\n'"
      register: new_jwt_secret
      changed_when: false

    - name: Display new JWT secret (first 20 chars)
      ansible.builtin.debug:
        msg: "✓ Generated new JWT secret: {{ new_jwt_secret.stdout[:20] }}..."

    # ============== UPDATE SECRET ==============
    - name: Get current secret values
      ansible.builtin.shell:
        cmd: "kubectl get secret {{ secret_name }} -n {{ ajasta_namespace }} -o json"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: current_secret_json

    - name: Patch secret with new JWT secret
      ansible.builtin.shell:
        cmd: |
          kubectl patch secret {{ secret_name }} -n {{ ajasta_namespace }} -p '{"stringData":{"JWT_SECRET":"{{ new_jwt_secret.stdout }}"}}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: secret_patch

    - name: Display secret update
      ansible.builtin.debug:
        msg: "✓ Updated JWT_SECRET in secret"

    # ============== RESTART BACKEND POD ==============
    - name: Restart backend pods
      ansible.builtin.shell:
        cmd: "kubectl rollout restart deployment {{ deployment_name }} -n {{ ajasta_namespace }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: rollout_restart

    - name: Display restart status
      ansible.builtin.debug:
        msg: "✓ Restarted backend deployment"

    - name: Wait for rollout to complete
      ansible.builtin.shell:
        cmd: "kubectl rollout status deployment {{ deployment_name }} -n {{ ajasta_namespace }} --timeout=120s"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: rollout_status

    - name: Display rollout status
      ansible.builtin.debug:
        msg: "✓ Backend rollout completed"

    # ============== VERIFY ==============
    - name: Get new pods
      ansible.builtin.shell:
        cmd: "kubectl get pods -n {{ ajasta_namespace }} -l app=ajasta-backend"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: new_pods

    - name: Display new pods
      ansible.builtin.debug:
        msg: "{{ new_pods.stdout_lines }}"

    - name: Get JWT secret from pod (verify)
      ansible.builtin.shell:
        cmd: "kubectl get secret {{ secret_name }} -n {{ ajasta_namespace }} -o jsonpath='{.data.JWT_SECRET}' | base64 -d | head -c 20"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: verify_secret

    - name: Display verified secret
      ansible.builtin.debug:
        msg: "✓ Verified new JWT_SECRET: {{ verify_secret.stdout }}..."

    # ============== CREATE ROLLBACK SCRIPT ==============
    - name: Create rollback script
      ansible.builtin.copy:
        dest: /tmp/rollback-jwt-secret-fix.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Rollback script for JWT secret fix
          # Generated by: 88-fix-jwt-secret.yml

          set -e

          NAMESPACE="{{ ajasta_namespace }}"
          SECRET="{{ secret_name }}"
          DEPLOYMENT="{{ deployment_name }}"
          BACKUP_DIR="{{ backup_dir }}"

          echo "================================================================"
          echo "ROLLBACK JWT SECRET FIX"
          echo "================================================================"
          echo ""

          # Confirm rollback
          echo "This will:"
          echo "  Restore original JWT secret"
          echo "  Restart backend deployment"
          echo ""
          read -p "Continue? (y/N) " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
            echo "Rollback cancelled"
            exit 0
          fi
          echo ""

          # Restore secret
          echo "Restoring JWT secret from backup..."
          kubectl apply -f "$BACKUP_DIR/{{ secret_name }}.yaml"
          echo "✓ Secret restored"
          echo ""

          # Restart deployment
          echo "Restarting backend deployment..."
          kubectl rollout restart deployment "$DEPLOYMENT" -n "$NAMESPACE"
          kubectl rollout status deployment "$DEPLOYMENT" -n "$NAMESPACE" --timeout=120s
          echo "✓ Backend restarted"
          echo ""

          echo "================================================================"
          echo "ROLLBACK COMPLETE"
          echo "================================================================"
          echo ""
          echo "JWT secret has been restored to original value."
          echo ""
          echo "Backup files preserved at: $BACKUP_DIR"
          echo ""

    - name: Make rollback script executable
      ansible.builtin.shell:
        cmd: "chmod +x /tmp/rollback-jwt-secret-fix.sh"
      changed_when: false

    # ============== DISPLAY SUMMARY ==============
    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "JWT SECRET FIXED"
          - "================================================================"
          - ""
          - "✓ Generated new 512-bit JWT secret"
          - "✓ Updated backend-secret"
          - "✓ Restarted backend deployment"
          - "✓ Rollout completed successfully"
          - ""
          - "TEST LOGIN:"
          - "  1. Open: https://{{ hostvars['localhost']['master_ip'] }}/"
          - "  2. Try logging in"
          - "  3. Login should work now!"
          - ""
          - "ROLLBACK IF NEEDED:"
          - "  /tmp/rollback-jwt-secret-fix.sh (on master node)"
          - ""
          - "BACKUP LOCATION: {{ backup_dir }}"
          - ""

- name: Final Instructions
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "JWT SECRET FIX COMPLETE"
          - "================================================================"
          - ""
          - "The JWT secret has been updated to a strong 512-bit key!"
          - ""
          - "Backend pods have been restarted with new secret."
          - ""
          - "TEST NOW:"
          - "  1. Open: https://{{ master_ip }}/"
          - "  2. Try logging in with your credentials"
          - "  3. Should work without JWT errors!"
          - ""
          - "================================================================"
