---
# Refresh local kubeconfig from master node
# This playbook fetches the latest admin.conf from the master node
# and updates the local ~/.kube/config with the correct master IP
#
# Usage:
#   ansible-playbook -i inventory.ini 00-refresh-kubeconfig.yml
#
# After running this, your local kubectl will use the correct master IP

- name: Refresh local kubeconfig from master
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display refresh information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "REFRESHING LOCAL KUBECONFIG"
          - "================================================================"
          - ""
          - "This playbook will:"
          - "  1. Read master IP from inventory.ini"
          - "  2. Fetch admin.conf from master node"
          - "  3. Update ~/.kube/config with correct IP"
          - "  4. Apply TLS fix for external access"
          - ""
          - "================================================================"

    - name: Check if inventory file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/inventory.ini"
      register: inventory_file

    - name: Fail if inventory not found
      ansible.builtin.fail:
        msg: "inventory.ini not found in {{ playbook_dir }}"
      when: not inventory_file.stat.exists

    - name: Extract master IP from inventory
      ansible.builtin.shell:
        cmd: "grep -E '^master-node.*ansible_host=' '{{ playbook_dir }}/inventory.ini' | sed -E 's/.*ansible_host=([0-9.]+).*/\\1/' | head -1"
      register: master_ip
      changed_when: false

    - name: Display detected master IP
      ansible.builtin.debug:
        msg: "Detected Master IP: {{ master_ip.stdout }}"

    - name: Fail if master IP not found
      ansible.builtin.fail:
        msg: "Could not extract master IP from inventory.ini"
      when: master_ip.stdout | length < 7

    - name: Get master node hostname from inventory
      ansible.builtin.shell:
        cmd: "grep -E '^master-node' '{{ playbook_dir }}/inventory.ini' | sed -E 's/.*ansible_host=[^ ]+ +(.*)/\\1/' | sed 's/ansible_user=.*//' | head -1 | xargs"
      register: master_info
      changed_when: false

    - name: Extract SSH user from inventory
      ansible.builtin.shell:
        cmd: "grep -E '^master-node.*ansible_user=' '{{ playbook_dir }}/inventory.ini' | sed -E 's/.*ansible_user=([^ ]+).*/\\1/' | head -1"
      register: ssh_user
      changed_when: false

    - name: Extract SSH key path from inventory
      ansible.builtin.shell:
        cmd: "grep -E '^master-node.*ansible_ssh_private_key_file=' '{{ playbook_dir }}/inventory.ini' | sed -E 's/.*ansible_ssh_private_key_file=([^ ]+).*/\\1/' | head -1"
      register: ssh_key_path
      changed_when: false

    - name: Set SSH user fact
      ansible.builtin.set_fact:
        ssh_user: "{{ ssh_user.stdout | default('ajasta') }}"
        ssh_key: "{{ ssh_key_path.stdout | default('~/.ssh/id_rsa') }}"

    - name: Display SSH connection info
      ansible.builtin.debug:
        msg:
          - "SSH User: {{ ssh_user }}"
          - "SSH Key: {{ ssh_key }}"
          - "Master IP: {{ master_ip.stdout }}"

    - name: Check if SSH key exists
      ansible.builtin.stat:
        path: "{{ ssh_key }}"
      register: ssh_key_file

    - name: Warn if SSH key not found
      ansible.builtin.debug:
        msg: "⚠️  SSH key not found: {{ ssh_key }}, will use default SSH agent"
      when: not ssh_key_file.stat.exists

    - name: Check current kubeconfig server IP
      ansible.builtin.shell:
        cmd: "grep -oP 'server: https://\\K[0-9.]+(?=:6443)' ~/.kube/config 2>/dev/null || echo ''"
      register: current_ip
      changed_when: false
      failed_when: false

    - name: Display current kubeconfig IP
      ansible.builtin.debug:
        msg: "Current kubeconfig IP: {{ current_ip.stdout | default('Not found') }}"

    - name: Backup existing kubeconfig
      ansible.builtin.shell:
        cmd: "cp ~/.kube/config ~/.kube/config.backup.ansible_refresh_$(date +%Y%m%d_%H%M%S)"
      when: current_ip.stdout | length > 0
      changed_when: false
      failed_when: false

    - name: Display backup message
      ansible.builtin.debug:
        msg: "Backed up existing kubeconfig"
      when: current_ip.stdout | length > 0

    - name: Fetch admin.conf from master node
      ansible.builtin.shell:
        cmd: "ssh -i {{ ssh_key }} -o StrictHostKeyChecking=no -o ConnectTimeout=10 {{ ssh_user }}@{{ master_ip.stdout }} 'sudo cat /etc/kubernetes/admin.conf' > /tmp/kubeconfig-master.new 2>&1"
      register: fetch_result
      changed_when: false
      failed_when: false
      when: ssh_key_file.stat.exists

    - name: Fetch admin.conf from master (fallback without SSH key)
      ansible.builtin.shell:
        cmd: "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 {{ ssh_user }}@{{ master_ip.stdout }} 'sudo cat /etc/kubernetes/admin.conf' > /tmp/kubeconfig-master.new 2>&1"
      register: fetch_result_fallback
      changed_when: false
      failed_when: false
      when:
        - not ssh_key_file.stat.exists or fetch_result.rc != 0

    - name: Set final fetch result
      ansible.builtin.set_fact:
        fetch_result: "{{ fetch_result if (ssh_key_file.stat.exists and fetch_result.rc == 0) else fetch_result_fallback }}"

    - name: Display fetch result
      ansible.builtin.debug:
        msg: "Fetch result: rc={{ fetch_result.rc }}, stderr={{ fetch_result.stderr | default('none') }}"

    - name: Check if fetch succeeded
      ansible.builtin.fail:
        msg: "Failed to fetch admin.conf from master (exit code {{ fetch_result.rc }}). Error: {{ fetch_result.stderr | default('Unknown error') }}"
      when: fetch_result.rc != 0

    - name: Display fetch success
      ansible.builtin.debug:
        msg: "✓ Successfully fetched admin.conf from master"

    - name: Update server IP in fetched kubeconfig
      ansible.builtin.replace:
        path: /tmp/kubeconfig-master.new
        regexp: 'server: https://[^:]*:6443'
        replace: 'server: https://{{ master_ip.stdout }}:6443'

    - name: Apply TLS fix for external IP access (using kubectl config)
      ansible.builtin.shell:
        cmd: "KUBECONFIG=/tmp/kubeconfig-master.new kubectl config set-cluster kubernetes --server=https://{{ master_ip.stdout }}:6443 --insecure-skip-tls-verify=true"
      changed_when: false
      failed_when: false

    - name: Create ~/.kube directory if not exists
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: '0700'

    - name: Copy new kubeconfig to ~/.kube/config
      ansible.builtin.copy:
        src: /tmp/kubeconfig-master.new
        dest: ~/.kube/config
        remote_src: yes
        mode: '0600'

    - name: Clean up temporary file
      ansible.builtin.file:
        path: /tmp/kubeconfig-master.new
        state: absent

    - name: Test cluster connectivity
      ansible.builtin.shell:
        cmd: "kubectl get nodes --request-timeout=10s"
      register: connectivity_test
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: ~/.kube/config

    - name: Display connectivity test result
      ansible.builtin.debug:
        msg: "{{ connectivity_test.stdout_lines | default(['Could not verify connectivity - cluster may still be initializing']) }}"

    - name: Display refresh summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "KUBECONFIG REFRESHED SUCCESSFULLY"
          - "================================================================"
          - ""
          - "Master IP: {{ master_ip.stdout }}"
          - "Kubeconfig: ~/.kube/config"
          - ""
          - "Your local kubectl now points to the correct master node!"
          - ""
          - "Test connectivity:"
          - "  kubectl get nodes"
          - "  kubectl get pods -A"
          - "  kubectl get pods -n ingress-nginx"
          - ""
          - "Note: TLS verification is disabled (insecure-skip-tls-verify: true)"
          - "      This is required because K8s API certificate is valid for internal IPs only"
          - ""
          - "================================================================"

- name: Verify from master node
  hosts: k8s_master
  become: yes
  gather_facts: no
  tasks:
    - name: Get cluster nodes from master
      ansible.builtin.command:
        cmd: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: master_nodes
      changed_when: false

    - name: Display master node cluster info
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "MASTER NODE CLUSTER INFO"
          - "================================================================"
          - "{{ master_nodes.stdout_lines }}"
          - "================================================================"
