---
# Deploy Loki for Log Aggregation (kubectl manifests - no Helm required)
# Works with existing kube-prometheus-stack Grafana
# Universal - works with any dynamically assigned master IP
# FULL ROLLBACK CAPABILITY
# Usage: ansible-playbook -i inventory.ini 23-deploy-loki-kubectl.yml

- name: Discover Master IP
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get master IP from inventory
      ansible.builtin.shell:
        cmd: "grep 'ansible_host=' inventory.ini | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2"
      register: inventory_ip
      changed_when: false

    - name: Set master IP fact
      ansible.builtin.set_fact:
        master_ip: "{{ inventory_ip.stdout }}"

    - name: Display configuration information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOY LOKI LOG AGGREGATION (kubectl manifests)"
          - "================================================================"
          - ""
          - "This will deploy:"
          - "  - Loki for log aggregation and storage"
          - "  - Persistent storage using Longhorn"
          - "  - Integration with existing Grafana"
          - ""
          - "Storage Configuration:"
          - "  - 5Gi persistent storage"
          - "  - 30-day retention policy"
          - ""
          - "Access:"
          - "  - Loki API: http://{{ master_ip }}:3100"
          - "  - Grafana: http://{{ master_ip }}:3000"
          - ""
          - "================================================================"

    - name: Confirm action
      ansible.builtin.pause:
        prompt: |
          This will deploy Loki using kubectl manifests.

          Press Enter to continue or Ctrl+C to cancel.

- name: Deploy Loki
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    loki_namespace: "monitoring"
    loki_storage_size: "5Gi"
    loki_retention: "720h"  # 30 days

  tasks:
    - name: Display deployment configuration
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOYING LOKI (kubectl manifests)"
          - "================================================================"
          - ""
          - "Namespace: {{ loki_namespace }}"
          - "Storage: {{ loki_storage_size }}"
          - "Retention: {{ loki_retention }}"
          - ""

    # ============== CREATE LOKI MANIFESTS ==============
    - name: Create Loki ConfigMap
      ansible.builtin.copy:
        dest: /tmp/loki-config.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: loki-config
            namespace: {{ loki_namespace }}
            labels:
              app: loki
          data:
            loki-config.yaml: |
              auth_enabled: false

              server:
                http_listen_port: 3100

              common:
                compactor_address: http://loki:3100
                path_prefix: /loki
                replication_factor: 1
                storage:
                  filesystem:
                    chunks_directory: /loki/chunks

                ring:
                  kvstore:
                    store: inmemory

              limits_config:
                retention_period: {{ loki_retention }}
                ingestion_rate_mb: 16
                ingestion_burst_size_mb: 32
                per_stream_rate_limit: 16MB
                per_stream_rate_limit_burst: 32MB
                max_streams_per_user: 0
                max_global_streams_per_user: 0

              schema_config:
                configs:
                  - from: "2024-01-01"
                    store: boltdb-shipper
                    object_store: filesystem
                    schema: v12
                    index:
                      prefix: index_
                      period: 24h

              compactor:
                working_directory: /loki/boltdb-shipper-compactor
                shared_store: filesystem
                compaction_interval: 10m
                retention_enabled: true
                delete_request_cancel_period: 24h

              ruler:
                storage:
                  type: local
                  local:
                    directory: /tmp/loki-rules

    - name: Create Loki Deployment manifest
      ansible.builtin.copy:
        dest: /tmp/loki-deployment.yaml
        mode: '0644'
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: loki
            namespace: {{ loki_namespace }}
            labels:
              app: loki
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: loki
            template:
              metadata:
                labels:
                  app: loki
              spec:
                containers:
                - name: loki
                  image: grafana/loki:2.9.10
                  securityContext:
                    runAsUser: 0
                    runAsGroup: 0
                  args:
                    - "-config.file=/etc/loki/loki-config.yaml"
                    - "-target=all"
                  ports:
                  - containerPort: 3100
                    name: http
                    protocol: TCP
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 250m
                      memory: 256Mi
                  volumeMounts:
                  - name: config
                    mountPath: /etc/loki
                    readOnly: true
                  - name: storage
                    mountPath: /loki
                  livenessProbe:
                    httpGet:
                      path: /ready
                      port: http
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 5
                    timeoutSeconds: 5
                    failureThreshold: 3
                volumes:
                - name: config
                  configMap:
                    name: loki-config
                - name: storage
                  persistentVolumeClaim:
                    claimName: loki-storage
                nodeSelector:
                  kubernetes.io/os: linux

    - name: Create Loki Service manifest
      ansible.builtin.copy:
        dest: /tmp/loki-service.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: Service
          metadata:
            name: loki
            namespace: {{ loki_namespace }}
            labels:
              app: loki
          spec:
            type: ClusterIP
            ports:
            - port: 3100
              targetPort: http
              protocol: TCP
              name: http
            selector:
              app: loki

    - name: Create Loki PVC manifest
      ansible.builtin.copy:
        dest: /tmp/loki-pvc.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: loki-storage
            namespace: {{ loki_namespace }}
            labels:
              app: loki
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn
            resources:
              requests:
                storage: {{ loki_storage_size }}

    - name: Display manifests creation
      ansible.builtin.debug:
        msg: "✓ Loki manifests created"

    # ============== DEPLOY LOKI ==============
    - name: Apply Loki manifests
      ansible.builtin.shell:
        cmd: |
          kubectl apply -f /tmp/loki-config.yaml
          kubectl apply -f /tmp/loki-pvc.yaml
          kubectl apply -f /tmp/loki-deployment.yaml
          kubectl apply -f /tmp/loki-service.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: loki_deploy

    - name: Display Loki deployment status
      ansible.builtin.debug:
        msg: "✓ Loki deployed via kubectl"

    # ============== VERIFY LOKI DEPLOYMENT ==============
    - name: Pause for Loki to start
      ansible.builtin.pause:
        seconds: 20

    - name: Check Loki pods
      ansible.builtin.shell:
        cmd: "kubectl get pods -n {{ loki_namespace }} -l app=loki"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: loki_pods

    - name: Display Loki pods
      ansible.builtin.debug:
        msg: "{{ loki_pods.stdout_lines }}"

    - name: Get Loki service
      ansible.builtin.shell:
        cmd: "kubectl get svc loki -n {{ loki_namespace }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: loki_service

    - name: Display Loki service
      ansible.builtin.debug:
        msg: "{{ loki_service.stdout_lines }}"

    # ============== TEST LOKI API ==============
    - name: Test Loki API
      ansible.builtin.shell:
        cmd: "kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never --command -- curl -s -o /dev/null -w '%{http_code}' http://loki.{{ loki_namespace }}.svc:3100/ready"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: loki_health
      failed_when: false
      changed_when: false

    - name: Display Loki health status
      ansible.builtin.debug:
        msg: "✓ Loki API status: HTTP {{ loki_health.stdout }}"

    # ============== CREATE ROLLBACK SCRIPT ==============
    - name: Create rollback script
      ansible.builtin.copy:
        dest: /tmp/rollback-loki-kubectl.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Rollback script for Loki deployment (kubectl)
          # Generated by: 23-deploy-loki-kubectl.yml

          set -e

          NAMESPACE="{{ loki_namespace }}"

          echo "================================================================"
          echo "ROLLBACK LOKI DEPLOYMENT"
          echo "================================================================"
          echo ""

          # Confirm rollback
          echo "This will:"
          echo "  Delete Loki deployment"
          echo "  Delete Loki service"
          echo "  Delete Loki ConfigMap"
          echo "  Optionally delete PVC"
          echo ""
          read -p "Continue? (y/N) " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
            echo "Rollback cancelled"
            exit 0
          fi
          echo ""

          # Delete deployment
          echo "Deleting Loki deployment..."
          kubectl delete deployment loki -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ Deployment deleted"
          echo ""

          # Delete service
          echo "Deleting Loki service..."
          kubectl delete service loki -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ Service deleted"
          echo ""

          # Delete ConfigMap
          echo "Deleting ConfigMap..."
          kubectl delete configmap loki-config -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ ConfigMap deleted"
          echo ""

          # Optionally delete PVC
          read -p "Delete persistent data? (y/N) " -n 1 -r
          echo
          if [[ $REPLY =~ ^[Yy]$ ]]; then
            echo "Deleting PVC..."
            kubectl delete pvc loki-storage -n "$NAMESPACE" 2>/dev/null || true
            echo "✓ PVC deleted"
          fi
          echo ""

          echo "================================================================"
          echo "ROLLBACK COMPLETE"
          echo "================================================================"
          echo ""
          echo "To re-deploy:"
          echo "  ansible-playbook -i inventory.ini 23-deploy-loki-kubectl.yml"
          echo ""

    - name: Make rollback script executable
      ansible.builtin.shell:
        cmd: "chmod +x /tmp/rollback-loki-kubectl.sh"
      changed_when: false

    # ============== DISPLAY SUMMARY ==============
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "LOKI DEPLOYMENT COMPLETE"
          - "================================================================"
          - ""
          - "✓ Loki deployed successfully"
          - "✓ Persistent storage configured ({{ loki_storage_size }})"
          - "✓ Retention policy: {{ loki_retention }}"
          - ""
          - "ACCESS:"
          - "  Loki API: http://{{ hostvars['localhost']['master_ip'] }}:3100"
          - "  (via kubectl port-forward svc/loki -n {{ loki_namespace }} 3100:3100)"
          - ""
          - "NEXT STEPS:"
          - "  1. Deploy Promtail: ansible-playbook -i inventory.ini 24-deploy-promtail-kubectl.yml"
          - "  2. Configure Grafana datasource"
          - "  3. View logs in Grafana"
          - ""
          - "USEFUL COMMANDS:"
          - "  kubectl get pods -n {{ loki_namespace }} -l app=loki"
          - "  kubectl logs -n {{ loki_namespace }} -l app=loki -f"
          - "  kubectl port-forward -n {{ loki_namespace }} svc/loki 3100:3100"
          - "  curl http://localhost:3100/ready"
          - ""
          - "ROLLBACK IF NEEDED:"
          - "  /tmp/rollback-loki-kubectl.sh (on master node)"
          - ""
          - "================================================================"

- name: Final Instructions
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "LOKI LOG AGGREGATION READY"
          - "================================================================"
          - ""
          - "Loki has been deployed for log aggregation!"
          - ""
          - "Next steps to complete the logging stack:"
          - ""
          - "1. Deploy Promtail (log collector):"
          - "   ansible-playbook -i inventory.ini 24-deploy-promtail-kubectl.yml"
          - ""
          - "2. Configure Grafana datasource"
          - ""
          - "3. View logs in Grafana → Explore"
          - ""
          - "================================================================"
