---
# Deploy ingress-nginx controller
# This playbook:
# 1. Installs ingress-nginx controller (v1.13.2)
# 2. Verifies the installation (pods, services)
# 3. Configures the controller for baremetal environments
# Usage:
#   ansible-playbook -i inventory.ini 13-deploy-ingress-nginx-controller.yml

- name: Deploy ingress-nginx controller
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    ingress_namespace: ingress-nginx
    ingress_release: "v1.13.2"
    ingress_manifest_url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-{{ ingress_release }}/deploy/static/provider/baremetal/deploy.yaml"

  tasks:
    - name: Display target information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOYING INGRESS-NGINX CONTROLLER"
          - "================================================================"
          - "Target: {{ inventory_hostname }}"
          - "Ingress Version: {{ ingress_release }}"
          - "Namespace: {{ ingress_namespace }}"
          - "================================================================"

    # ============== GET NODE PUBLIC IP FOR INGRESS HOST ==============
    - name: Get node's external IP address
      ansible.builtin.shell:
        cmd: |
          # Try to get the external IP from the node
          curl -s https://ifconfig.me 2>/dev/null || \
          curl -s https://icanhazip.com 2>/dev/null || \
          curl -s https://ipecho.net/plain 2>/dev/null || \
          hostname -I | awk '{print $1}'
      register: public_ip
      changed_when: false
      timeout: 30
      failed_when: public_ip.stdout | length < 7

    - name: Display detected public IP
      ansible.builtin.debug:
        msg: "Detected Public IP: {{ public_ip.stdout }}"

    # ============== DOWNLOAD INGRESS-NGINX MANIFEST ==============
    - name: Download ingress-nginx controller manifest
      ansible.builtin.get_url:
        url: "{{ ingress_manifest_url }}"
        dest: /tmp/ingress-nginx-deploy.yaml
        mode: '0644'
        timeout: 60
      register: download_manifest

    - name: Display manifest download result
      ansible.builtin.debug:
        msg: "Ingress-nginx manifest downloaded to /tmp/ingress-nginx-deploy.yaml"

    # ============== INSTALL INGRESS-NGINX CONTROLLER ==============
    - name: Check if ingress-nginx controller is already deployed
      ansible.builtin.command:
        cmd: kubectl get deployment -n {{ ingress_namespace }} ingress-nginx-controller
      register: ingress_deployment
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Set fact for ingress deployment status
      ansible.builtin.set_fact:
        ingress_deployed_new: "{{ ingress_deployment.rc != 0 }}"

    - name: Apply ingress-nginx controller manifest
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/ingress-nginx-deploy.yaml
      register: ingress_apply
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display ingress-nginx installation result
      ansible.builtin.debug:
        msg: "{{ ingress_apply.stdout_lines }}"

    - name: Display ingress already deployed message
      ansible.builtin.debug:
        msg:
          - "✓ ingress-nginx controller already deployed"
          - "Controller is operational on this cluster"
      when: not ingress_deployed_new

    # ============== WAIT FOR INGRESS-NGINX PODS ==============
    - name: Pause for ingress-nginx to initialize
      ansible.builtin.pause:
        seconds: 15
      when: ingress_deployed_new

    - name: Wait for ingress-nginx controller deployment to be ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=available deployment/ingress-nginx-controller -n {{ ingress_namespace }} --timeout=300s
      register: ingress_ready
      until: ingress_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: ingress_deployed_new
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display ingress-nginx controller ready status
      ansible.builtin.debug:
        msg: "{{ ingress_ready.stdout | default('Ingress-nginx controller is ready', true) }}"

    # ============== VERIFY INGRESS-NGINX INSTALLATION ==============
    - name: Get all pods in ingress-nginx namespace
      ansible.builtin.command:
        cmd: kubectl get pods -n {{ ingress_namespace }}
      register: ingress_pods
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display ingress-nginx pods
      ansible.builtin.debug:
        msg: "{{ ingress_pods.stdout_lines }}"

    - name: Verify ingress-nginx controller pod is running
      ansible.builtin.shell:
        cmd: kubectl get pods -n {{ ingress_namespace }} -l app.kubernetes.io/name=ingress-nginx --no-headers | grep Running
      register: controller_pod_check
      changed_when: false
      until: controller_pod_check.rc == 0
      retries: 30
      delay: 5
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display controller pod verification
      ansible.builtin.debug:
        msg: "{{ controller_pod_check.stdout_lines }}"

    - name: Get all services in ingress-nginx namespace
      ansible.builtin.command:
        cmd: kubectl get service -n {{ ingress_namespace }}
      register: ingress_services
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display ingress-nginx services
      ansible.builtin.debug:
        msg: "{{ ingress_services.stdout_lines }}"

    - name: Get ingress-nginx controller NodePort
      ansible.builtin.command:
        cmd: kubectl get -n {{ ingress_namespace }} service/ingress-nginx-controller -o jsonpath='{.spec.ports[0].nodePort}'
      register: node_port
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display NodePort
      ansible.builtin.debug:
        msg: "Ingress-nginx controller NodePort: {{ node_port.stdout }}"

    - name: Set NodePort fact for later use
      ansible.builtin.set_fact:
        ingress_nodeport: "{{ node_port.stdout }}"

    # ============== INGRESS READY FOR USE ==============
    - name: Display Ingress controller ready message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "INGRESS NGINX CONTROLLER DEPLOYED SUCCESSFULLY"
          - "================================================================"
          - ""
          - "Ingress NGINX controller is running and ready to route traffic."
          - "You can now create Ingress resources for your applications."
          - ""
          - "Example Ingress resource manifest:"
          - "  apiVersion: networking.k8s.io/v1"
          - "  kind: Ingress"
          - "  metadata:"
          - "    name: my-app-ingress"
          - "  spec:"
          - "    ingressClassName: nginx"
          - "    rules:"
          - "    - host: my-app.example.com"
          - "      http:"
          - "        paths:"
          - "        - path: /"
          - "          pathType: Prefix"
          - "          backend:"
          - "            service:"
          - "              name: my-service"
          - "              port:"
          - "                number: 80"
          - "================================================================"

    # ============== SUMMARY ==============
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "INGRESS-NGINX DEPLOYED SUCCESSFULLY"
          - "================================================================"
          - ""
          - "Ingress-Nginx Configuration:"
          - "  - Version: {{ ingress_release }}"
          - "  - Namespace: {{ ingress_namespace }}"
          - "  - Controller NodePort: {{ ingress_nodeport }}"
          - ""
          - "The Ingress controller is ready to handle HTTP/S routing."
          - ""
          - "Creating Ingress Resources:"
          - "  Use 'ingressClassName: nginx' in your Ingress manifests"
          - "  The controller will automatically route traffic to your services"
          - ""
          - "Ingress Controller Details:"
          - "  kubectl get pods -n {{ ingress_namespace }}"
          - "  kubectl get svc -n {{ ingress_namespace }}"
          - "  kubectl logs -n {{ ingress_namespace }} -l app.kubernetes.io/name=ingress-nginx"
          - ""
          - "View Ingress Resources:"
          - "  kubectl get ingress -A"
          - ""
          - "Troubleshooting:"
          - "  - Check NodePort: {{ ingress_nodeport }}"
          - "  - Check firewall allows port {{ ingress_nodeport }}"
          - "  - Check controller logs for errors"
          - ""
          - "To uninstall:"
          - "  helm uninstall ingress-nginx -n {{ ingress_namespace }}"
          - ""
          - "================================================================"

- name: Overall summary
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "INGRESS-NGINX READY"
          - "================================================================"
          - ""
          - "The ingress-nginx controller has been deployed successfully."
          - ""
          - "What is Ingress?"
          - "  - Ingress provides HTTP/S routing to services within cluster"
          - "  - Acts as a reverse proxy and load balancer"
          - "  - Allows host and path-based routing"
          - ""
          - "Next Steps:"
          - "  1. Deploy your applications to the cluster"
          - "  2. Create Ingress resources to expose them"
          - "  3. Configure TLS/SSL for secure connections (optional)"
          - ""
          - "Example Ingress Manifest:"
          - "  See the output above for a complete example"
          - ""
          - "================================================================"
