---
# Expose Hubble UI via NodePort service
# Usage:
#   ansible-playbook -i inventory.ini 05-expose-hubble.yml

- name: Expose Hubble UI via NodePort
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    hubble_nodeport: 31000

  tasks:
    - name: Display target information
      ansible.builtin.debug:
        msg:
          - "Target: {{ inventory_hostname }}"
          - "Exposing Hubble UI on NodePort {{ hubble_nodeport }}"

    - name: Get external IP for accessing Hubble UI
      ansible.builtin.shell:
        cmd: |
          curl -s http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || \
          hostname -I | awk '{print $1}'
      register: external_ip
      changed_when: false

    - name: Set external IP fact
      ansible.builtin.set_fact:
        node_external_ip: "{{ external_ip.stdout | default(ansible_default_ipv4.address) }}"

    # ============== CHECK HUBBLE UI SERVICE ==============
    - name: Get current Hubble UI service
      ansible.builtin.command:
        cmd: kubectl get service hubble-ui -n kube-system -o yaml
      register: hubble_service_current
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display current Hubble UI service type
      ansible.builtin.debug:
        msg: "{{ 'Hubble UI service exists' if hubble_service_current.rc == 0 else 'Hubble UI service not found' }}"

    # ============== PATCH HUBBLE UI SERVICE TO NODEPORT ==============
    - name: Patch Hubble UI service to NodePort
      ansible.builtin.command:
        cmd: >
          kubectl patch service hubble-ui -n kube-system
          --type='json'
          -p='[
            {"op": "replace", "path": "/spec/type", "value": "NodePort"},
            {"op": "replace", "path": "/spec/ports/0/nodePort", "value": {{ hubble_nodeport }}}
          ]'
      register: patch_hubble
      until: patch_hubble.rc == 0
      retries: 3
      delay: 2
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display patch result
      ansible.builtin.debug:
        msg: "{{ patch_hubble.stdout | default('Hubble UI service patched to NodePort') }}"

    # ============== VERIFY HUBBLE UI SERVICE ==============
    - name: Get Hubble UI service details
      ansible.builtin.command:
        cmd: kubectl get service hubble-ui -n kube-system
      register: hubble_service
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display Hubble UI service
      ansible.builtin.debug:
        msg: "{{ hubble_service.stdout_lines }}"

    - name: Wait for Hubble UI endpoint to be ready
      ansible.builtin.pause:
        seconds: 10

    - name: Test Hubble UI endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ hubble_nodeport }}"
        return_content: yes
        timeout: 10
      register: hubble_ui_test
      failed_when: false

    - name: Display Hubble UI test result
      ansible.builtin.debug:
        msg:
          - "Hubble UI HTTP {{ hubble_ui_test.status | default('Unknown') }}"
          - "{{ 'UI accessible!' if hubble_ui_test.status == 200 else 'UI not yet accessible (may take more time)' }}"

    # ============== GET NODE INFORMATION ==============
    - name: Get cluster nodes with IPs
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"

    # ============== SUMMARY ==============
    - name: Display Hubble UI exposure summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "HUBBLE UI EXPOSED VIA NODEPORT"
          - "================================================================"
          - ""
          - "Access Hubble UI from your browser:"
          - "  http://{{ node_external_ip }}:{{ hubble_nodeport }}"
          - ""
          - "Or use any node IP:"
          - "{{ cluster_nodes.stdout | regex_findall('\\d+\\.\\d+\\.\\d+\\.\\d+') }}"
          - ""
          - "Hubble UI Features:"
          - "  - Real-time network flow visualization"
          - "  - Service topology map"
          - "  - DNS query monitoring"
          - "  - Network policy debugging"
          - ""
          - "Note: If UI shows no data, wait for traffic or run connectivity test:"
          - "  ssh centos@{{ node_external_ip }} 'cilium connectivity test'"
          - "================================================================"

- name: Overall summary
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "HUBBLE UI NOW ACCESSIBLE"
          - "================================================================"
          - ""
          - "Open your browser and navigate to:"
          - "  http://<any-node-ip>:31000"
          - ""
          - "Next step: Deploy test applications"
          - "  ansible-playbook -i inventory.ini 06-deploy-test-app.yml"
          - "================================================================"
