---
# Configure Grafana Loki Datasource & Deploy cAdvisor
# Works with existing kube-prometheus-stack Grafana
# Deploys cAdvisor for container metrics (node_exporter already exists)
# Universal - works with any dynamically assigned master IP
# FULL ROLLBACK CAPABILITY
# Usage: ansible-playbook -i inventory.ini 25-configure-grafana-loki.yml

- name: Discover Master IP
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get master IP from inventory
      ansible.builtin.shell:
        cmd: "grep 'ansible_host=' inventory.ini | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2"
      register: inventory_ip
      changed_when: false

    - name: Set master IP fact
      ansible.builtin.set_fact:
        master_ip: "{{ inventory_ip.stdout }}"

    - name: Display configuration information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "CONFIGURE GRAFANA & DEPLOY CADVISOR"
          - "================================================================"
          - ""
          - "This will:"
          - "  - Configure Grafana Loki datasource"
          - "  - Deploy cAdvisor for container metrics"
          - "  - Restart Grafana to load datasource"
          - ""
          - "Note: node_exporter already deployed with kube-prometheus-stack"
          - ""
          - "================================================================"

    - name: Confirm action
      ansible.builtin.pause:
        prompt: |
          This will configure Grafana and deploy cAdvisor.

          Press Enter to continue or Ctrl+C to cancel.

- name: Configure Grafana & Deploy cAdvisor
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    loki_namespace: "monitoring"

  tasks:
    - name: Display deployment configuration
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "CONFIGURING GRAFANA & DEPLOYING CADVISOR"
          - "================================================================"
          - ""
          - "Namespace: {{ loki_namespace }}"
          - ""

    # ============== DEPLOY CADVISOR ==============
    - name: Create cAdvisor DaemonSet manifest
      ansible.builtin.copy:
        dest: /tmp/cadvisor-daemonset.yaml
        mode: '0644'
        content: |
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: cadvisor
            namespace: {{ loki_namespace }}
            labels:
              app: cadvisor
          spec:
            selector:
              matchLabels:
                app: cadvisor
            template:
              metadata:
                labels:
                  app: cadvisor
              spec:
                hostNetwork: true
                tolerations:
                - effect: NoSchedule
                  operator: Exists
                containers:
                - name: cadvisor
                  image: gcr.io/cadvisor/cadvisor:v0.47.2
                  args:
                    - '--housekeeping_interval=10s'
                    - '--max_housekeeping_interval=15s'
                    - '--event_storage_event_limit=default=0'
                    - '--event_storage_age_limit=default=0'
                    - '--enable_metrics=app,cpu,disk,diskIO,memory,network,process'
                    - '--docker_only=true'
                  ports:
                  - name: metrics
                    containerPort: 8080
                    hostPort: 8080
                  resources:
                    requests:
                      cpu: 100m
                      memory: 100Mi
                    limits:
                      cpu: 300m
                      memory: 300Mi
                  volumeMounts:
                  - name: varrun
                    mountPath: /var/run
                  - name: varlibdocker
                    mountPath: /var/lib/docker
                    readOnly: true
                  - name: sysfs
                    mountPath: /sys
                    readOnly: true
                volumes:
                - name: varrun
                  hostPath:
                    path: /var/run
                - name: varlibdocker
                  hostPath:
                    path: /var/lib/docker
                - name: sysfs
                  hostPath:
                    path: /sys
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: cadvisor
            namespace: {{ loki_namespace }}
            labels:
              app: cadvisor
          spec:
            type: ClusterIP
            ports:
            - name: metrics
              port: 8080
              targetPort: 8080
            selector:
              app: cadvisor

    - name: Deploy cAdvisor
      ansible.builtin.shell:
        cmd: "kubectl apply -f /tmp/cadvisor-daemonset.yaml"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cadvisor_deploy

    - name: Display cAdvisor deployment
      ansible.builtin.debug:
        msg: "✓ cAdvisor deployed"

    # ============== CONFIGURE GRAFANA LOKI DATASOURCE ==============
    - name: Create Grafana Loki datasource ConfigMap
      ansible.builtin.copy:
        dest: /tmp/grafana-loki-datasource.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-loki-datasource
            namespace: {{ loki_namespace }}
            labels:
              grafana_datasource: "1"
          data:
            loki-datasource.yaml: |
              apiVersion: 1

              datasources:
              - name: Loki
                type: loki
                access: proxy
                url: http://loki.{{ loki_namespace }}.svc:3100
                version: 1
                editable: false
                isDefault: false
                jsonData:
                  maxLines: 1000
                  derivedFields:
                    - datasourceUid: prometheus
                      matcherRegex: ".*"
                      name: TraceID
                      url: $$__auto

    - name: Apply Grafana datasource
      ansible.builtin.shell:
        cmd: "kubectl apply -f /tmp/grafana-loki-datasource.yaml"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: datasource_apply

    - name: Display datasource creation
      ansible.builtin.debug:
        msg: "✓ Grafana Loki datasource created"

    - name: Patch Grafana deployment to use ConfigMap datasource
      ansible.builtin.shell:
        cmd: |
          kubectl patch deployment kube-prometheus-grafana -n {{ loki_namespace }} --type='json' \
          -p='[
            {
              "op": "add",
              "path": "/spec/template/metadata/annotations",
              "value": {
                "grafana_datasources": "1"
              }
            }
          ]' || true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: grafana_patch
      failed_when: false

    - name: Restart Grafana to load datasource
      ansible.builtin.shell:
        cmd: "kubectl rollout restart deployment kube-prometheus-grafana -n {{ loki_namespace }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: grafana_restart

    - name: Display Grafana restart
      ansible.builtin.debug:
        msg: "✓ Grafana restarting to load datasource"

    # ============== VERIFY DEPLOYMENTS ==============
    - name: Pause for deployments to start
      ansible.builtin.pause:
        seconds: 20

    - name: Check all monitoring pods
      ansible.builtin.shell:
        cmd: |
          echo "=== Loki ==="
          kubectl get pods -n {{ loki_namespace }} -l app=loki
          echo ""
          echo "=== Promtail ==="
          kubectl get pods -n {{ loki_namespace }} -l app=promtail
          echo ""
          echo "=== cAdvisor ==="
          kubectl get pods -n {{ loki_namespace }} -l app=cadvisor
          echo ""
          echo "=== node_exporter (from kube-prometheus) ==="
          kubectl get pods -n {{ loki_namespace }} -l app.kubernetes.io/name=node-exporter
          echo ""
          echo "=== Grafana ==="
          kubectl get pods -n {{ loki_namespace }} -l app.kubernetes.io/name=grafana
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: monitoring_pods

    - name: Display monitoring pods
      ansible.builtin.debug:
        msg: "{{ monitoring_pods.stdout_lines }}"

    # ============== CREATE ROLLBACK SCRIPT ==============
    - name: Create rollback script
      ansible.builtin.copy:
        dest: /tmp/rollback-grafana-cadvisor.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Rollback script for Grafana config and cAdvisor
          # Generated by: 25-configure-grafana-loki.yml

          set -e

          NAMESPACE="{{ loki_namespace }}"

          echo "================================================================"
          echo "ROLLBACK GRAFANA CONFIG & CADVISOR"
          echo "================================================================"
          echo ""

          # Confirm rollback
          echo "This will:"
          echo "  Delete cAdvisor DaemonSet"
          echo "  Delete Grafana Loki datasource"
          echo "  Restart Grafana"
          echo ""
          read -p "Continue? (y/N) " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
            echo "Rollback cancelled"
            exit 0
          fi
          echo ""

          # Delete cAdvisor
          echo "Deleting cAdvisor..."
          kubectl delete daemonset cadvisor -n "$NAMESPACE" 2>/dev/null || true
          kubectl delete service cadvisor -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ cAdvisor deleted"
          echo ""

          # Delete datasource
          echo "Deleting Grafana datasource..."
          kubectl delete configmap grafana-loki-datasource -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ Datasource deleted"
          echo ""

          # Restart Grafana
          echo "Restarting Grafana..."
          kubectl rollout restart deployment kube-prometheus-grafana -n "$NAMESPACE"
          echo "✓ Grafana restarted"
          echo ""

          echo "================================================================"
          echo "ROLLBACK COMPLETE"
          echo "================================================================"
          echo ""
          echo "To re-deploy:"
          echo "  ansible-playbook -i inventory.ini 25-configure-grafana-loki.yml"
          echo ""

    - name: Make rollback script executable
      ansible.builtin.shell:
        cmd: "chmod +x /tmp/rollback-grafana-cadvisor.sh"
      changed_when: false

    # ============== DISPLAY SUMMARY ==============
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "GRAFANA CONFIG & CADVISOR DEPLOYMENT COMPLETE"
          - "================================================================"
          - ""
          - "✓ cAdvisor deployed (container metrics)"
          - "✓ Grafana Loki datasource configured"
          - "✓ Grafana restarted"
          - ""
          - "EXPORTER ENDPOINTS:"
          - "  - node_exporter: :9100/metrics (already deployed)"
          - "  - cAdvisor: :8080/metrics (newly deployed)"
          - "  - kube-state-metrics: :8080/metrics (already deployed)"
          - ""
          - "GRAFANA:"
          - "  URL: http://{{ hostvars['localhost']['master_ip'] }}:3000"
          - "  Datasource: Loki (configured)"
          - "  Explore: View logs from Loki"
          - ""
          - "NEXT STEPS:"
          - "  1. Open Grafana: http://{{ hostvars['localhost']['master_ip'] }}:3000"
          - "  2. Go to Explore → Select Loki datasource"
          - "  3. Query logs: {namespace=\"ajasta\"}"
          - "  4. Create dashboards for metrics"
          - ""
          - "USEFUL COMMANDS:"
          - "  kubectl get pods -n {{ loki_namespace }}"
          - "  kubectl logs -n {{ loki_namespace }} -l app=promtail -f"
          - "  kubectl port-forward -n {{ loki_namespace }} svc/loki 3100:3100"
          - ""
          - "ROLLBACK IF NEEDED:"
          - "  /tmp/rollback-grafana-cadvisor.sh (on master node)"
          - ""
          - "================================================================"

- name: Final Instructions
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "COMPLETE LOGGING & MONITORING STACK READY"
          - "================================================================"
          - ""
          - "Your full monitoring stack is now ready!"
          - ""
          - "Components deployed:"
          - "  ✓ Loki (log aggregation)"
          - "  ✓ Promtail (log collection)"
          - "  ✓ Grafana (visualization)"
          - "  ✓ node_exporter (system metrics) - from kube-prometheus"
          - "  ✓ kube-state-metrics (K8s metrics) - from kube-prometheus"
          - "  ✓ cAdvisor (container metrics) - newly deployed"
          - ""
          - "Access Grafana:"
          - "  http://{{ master_ip }}:3000"
          - "  Default credentials: admin / prom-operator"
          - ""
          - "View logs:"
          - "  1. Open Grafana"
          - "  2. Go to Explore"
          - "  3. Select Loki datasource"
          - "  4. Query: {namespace=\"ajasta\"} |= \"error\""
          - ""
          - "Next:"
          - "  1. Create custom dashboards"
          - "  2. Set up alerts"
          - "  3. Import community dashboards"
          - ""
          - "================================================================"
