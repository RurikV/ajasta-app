---
# Verify Ajasta Frontend Access via Master IP
# This playbook verifies frontend is accessible via the current master IP
# Dynamically discovers the master IP - works with any dynamically assigned IP
# No DNS changes required - direct IP access
# Usage: ansible-playbook -i inventory.ini 72-verify-master-ip-access.yml

- name: Discover Master IP
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get master IP from inventory
      ansible.builtin.shell:
        cmd: "grep 'ansible_host=' inventory.ini | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2"
      register: inventory_ip
      changed_when: false

    - name: Set master IP fact
      ansible.builtin.set_fact:
        master_ip: "{{ inventory_ip.stdout }}"

    - name: Display discovered master IP
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DISCOVERED MASTER IP"
          - "================================================================"
          - ""
          - "Master IP from inventory: {{ master_ip }}"
          - ""

- name: Verify Frontend Access via Master IP
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    domain: "ajasta.top"
    http_nodeport: 31180
    https_nodeport: 30577
    ajasta_namespace: "ajasta"

  tasks:
    - name: Get master's public IP (from localhost facts)
      ansible.builtin.set_fact:
        master_public_ip: "{{ hostvars['localhost']['master_ip'] }}"

    - name: Display verification information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "VERIFY FRONTEND ACCESS VIA MASTER IP"
          - "================================================================"
          - ""
          - "Master IP: {{ master_public_ip }}"
          - "Domain: {{ domain }}"
          - "HTTP NodePort: {{ http_nodeport }}"
          - "HTTPS NodePort: {{ https_nodeport }}"
          - ""
          - "This playbook dynamically discovers and uses the current master IP."
          - "Works with any dynamically assigned master VM IP."
          - ""

    # ============== CHECK INGRESS ==============
    - name: Check ajasta ingress
      ansible.builtin.shell:
        cmd: "kubectl get ingress ajasta-ingress -n {{ ajasta_namespace }}"
      register: ingress_check

    - name: Display ingress status
      ansible.builtin.debug:
        msg: "{{ ingress_check.stdout_lines }}"

    # ============== CHECK PODS ==============
    - name: Check ajasta pods
      ansible.builtin.shell:
        cmd: "kubectl get pods -n {{ ajasta_namespace }}"
      register: pods_check

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pods_check.stdout_lines }}"

    # ============== TEST HTTP ACCESS ==============
    - name: Test HTTP access with Host header
      ansible.builtin.shell:
        cmd: "curl -sL -o /dev/null -w '%{http_code}' -H 'Host: {{ domain }}' -m 10 http://localhost:{{ http_nodeport }}/"
      register: http_test
      failed_when: http_test.stdout not in ["200", "308", "301"]
      changed_when: false

    - name: Display HTTP test result
      ansible.builtin.debug:
        msg: "✓ HTTP (with Host header): HTTP {{ http_test.stdout }}"

    # ============== TEST HTTPS ACCESS ==============
    - name: Test HTTPS access with Host header
      ansible.builtin.shell:
        cmd: "curl -skL -o /dev/null -w '%{http_code}' -H 'Host: {{ domain }}' -m 10 https://localhost:{{ https_nodeport }}/"
      register: https_test

    - name: Display HTTPS test result
      ansible.builtin.debug:
        msg: "✓ HTTPS (with Host header): HTTP {{ https_test.stdout }}"
      when: https_test.stdout == "200"

    - name: Fail if HTTPS fails
      ansible.builtin.fail:
        msg: "HTTPS test failed: HTTP {{ https_test.stdout }}"
      when: https_test.stdout != "200"

    # ============== TEST FRONTEND CONTENT ==============
    - name: Test frontend page content
      ansible.builtin.shell:
        cmd: "curl -skL -H 'Host: {{ domain }}' -m 10 https://localhost:{{ https_nodeport }}/ | head -20"
      register: frontend_content

    - name: Display frontend content preview
      ansible.builtin.debug:
        msg: "{{ frontend_content.stdout_lines }}"

    # ============== CREATE ACCESS VERIFICATION SCRIPT ==============
    - name: Create external access script
      ansible.builtin.copy:
        dest: /tmp/verify-frontend-master-ip.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Frontend Access Verification via Master IP
          # Generated by: 72-verify-master-ip-access.yml
          # This script works with the current master IP from inventory

          DOMAIN="{{ domain }}"
          MASTER_IP="{{ master_public_ip }}"
          HTTP_PORT={{ http_nodeport }}
          HTTPS_PORT={{ https_nodeport }}

          echo "================================================================"
          echo "FRONTEND ACCESS VERIFICATION (Direct Master IP)"
          echo "================================================================"
          echo ""

          echo "1. TESTING LOCAL ACCESS (on master node)"
          echo ""

          # Test HTTP
          HTTP_CODE=$(curl -sL -o /dev/null -w '%{http_code}' -H "Host: $DOMAIN" -m 10 http://localhost:$HTTP_PORT/)
          echo "   HTTP (localhost:$HTTP_PORT) → HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "308" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "   ✓ HTTP redirect working"
          fi
          echo ""

          # Test HTTPS
          HTTPS_CODE=$(curl -skL -o /dev/null -w '%{http_code}' -H "Host: $DOMAIN" -m 10 https://localhost:$HTTPS_PORT/)
          echo "   HTTPS (localhost:$HTTPS_PORT) → HTTP $HTTPS_CODE"
          if [ "$HTTPS_CODE" = "200" ]; then
            echo "   ✓ HTTPS frontend accessible locally"
          fi
          echo ""

          echo "2. ACCESS URLs (from your local machine)"
          echo ""
          echo "   IMPORTANT: You MUST use the Host header for these to work!"
          echo ""
          echo "   Using curl:"
          echo "   curl -k -H 'Host: $DOMAIN' https://$MASTER_IP:$HTTPS_PORT/"
          echo ""
          echo "   Using browser:"
          echo "   - Not directly supported (browsers don't send custom Host headers easily)"
          echo "   - Use SSH port forwarding instead (see below)"
          echo ""

          echo "3. SSH PORT FORWARDING (recommended for browser access)"
          echo ""
          echo "   From your local machine, run:"
          echo "   ssh -L 3000:localhost:$HTTPS_PORT ajasta@$MASTER_IP -N"
          echo ""
          echo "   Then open in browser:"
          echo "   https://localhost:3000/ (with Host header set via browser extension)"
          echo "   Or simply use: http://localhost:3000/"
          echo ""

          echo "4. DNS CONFIGURATION (for direct browser access)"
          echo ""
          echo "   For direct browser access without port forwarding:"
          echo "   1. Update DNS A record on Porkbun.com:"
          echo "      ajasta.top → $MASTER_IP"
          echo "   2. Wait 5-30 minutes for DNS propagation"
          echo "   3. Access: https://$DOMAIN/"
          echo ""
          echo "   To configure DNS:"
          echo "     ansible-playbook -i inventory.ini 70-configure-frontend-dns.yml"
          echo ""

          echo "================================================================"
          echo "SUMMARY"
          echo "================================================================"
          echo ""
          if [ "$HTTPS_CODE" = "200" ]; then
            echo "✓ Frontend is accessible via master IP"
            echo ""
            echo "Direct access methods:"
            echo "  1. Via IP + Host header: curl -k -H 'Host: $DOMAIN' https://$MASTER_IP:$HTTPS_PORT/"
            echo "  2. Via SSH port forwarding: ssh -L 3000:localhost:$HTTPS_PORT ajasta@$MASTER_IP -N"
            echo "  3. Via DNS update: ansible-playbook -i inventory.ini 70-configure-frontend-dns.yml"
            echo ""
          else
            echo "✗ Frontend not accessible (HTTP $HTTPS_CODE)"
          fi
          echo "================================================================"

    - name: Make verification script executable
      ansible.builtin.shell:
        cmd: "chmod +x /tmp/verify-frontend-master-ip.sh"
      changed_when: false

    # ============== DISPLAY SUMMARY ==============
    - name: Display access summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "FRONTEND ACCESS VERIFIED"
          - "================================================================"
          - ""
          - "✓ Ingress configured"
          - "✓ Pods running"
          - "✓ HTTP access: HTTP {{ http_test.stdout }}"
          - "✓ HTTPS access: HTTP {{ https_test.stdout }}"
          - ""
          - "ACCESS METHODS:"
          - ""
          - "1. DIRECT CURL ACCESS (from anywhere):"
          - "   curl -k -H 'Host: {{ domain }}' https://{{ master_public_ip }}:{{ https_nodeport }}/"
          - ""
          - "2. SSH PORT FORWARDING (for browser):"
          - "   ssh -L 3000:localhost:{{ https_nodeport }} ajasta@{{ master_public_ip }} -N"
          - "   Then open: http://localhost:3000/"
          - ""
          - "3. DNS CONFIGURATION (for direct browser access):"
          - "   Update DNS: ajasta.top → {{ master_public_ip }}"
          - "   Run: ansible-playbook -i inventory.ini 70-configure-frontend-dns.yml"
          - "   Then access: https://{{ domain }}/"
          - ""
          - "CURRENT STATUS:"
          - "  - Frontend: Running on {{ master_public_ip }}"
          - "  - Backend API: Running on {{ master_public_ip }}"
          - "  - TLS Certificate: Configured for {{ domain }}"
          - "  - Master IP: {{ master_public_ip }} (dynamically discovered)"
          - ""
          - "VERIFICATION SCRIPT: /tmp/verify-frontend-master-ip.sh"
          - ""
          - "================================================================"

- name: Final Instructions
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "FRONTEND ACCESS READY"
          - "================================================================"
          - ""
          - "The ajasta frontend is accessible via master IP {{ master_ip }}."
          - ""
          - "This playbook automatically discovers the master IP from inventory.ini"
          - "It works with any dynamically assigned master VM IP address."
          - ""
          - "QUICK TEST (from your machine):"
          - "  curl -k -H 'Host: ajasta.top' https://{{ master_ip }}:30577/"
          - ""
          - "FOR BROWSER ACCESS - Choose one:"
          - ""
          - "Option 1: SSH Port Forwarding (no DNS change needed)"
          - "  ssh -L 3000:localhost:30577 ajasta@{{ master_ip }} -N"
          - "  Open: http://localhost:3000/"
          - ""
          - "Option 2: Update DNS (requires DNS change on Porkbun)"
          - "  ansible-playbook -i inventory.ini 70-configure-frontend-dns.yml"
          - "  Update DNS: ajasta.top → {{ master_ip }}"
          - "  Open: https://ajasta.top/"
          - ""
          - "ROLLBACK OPTIONS:"
          - "  - 71-rollback-frontend-dns.yml (rollback DNS changes)"
          - "  - 62-replace-master-nat-ip.yml (replace master NAT IP)"
          - ""
          - "NEXT TIME:"
          - "  Just run this playbook again - it will auto-discover the current master IP!"
          - ""
          - "================================================================"
