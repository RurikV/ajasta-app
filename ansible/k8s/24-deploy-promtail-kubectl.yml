---
# Deploy Promtail for Log Collection (kubectl manifests - no Helm required)
# Collects logs from all nodes and sends to Loki
# Universal - works with any dynamically assigned master IP
# FULL ROLLBACK CAPABILITY
# Usage: ansible-playbook -i inventory.ini 24-deploy-promtail-kubectl.yml

- name: Discover Master IP
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get master IP from inventory
      ansible.builtin.shell:
        cmd: "grep 'ansible_host=' inventory.ini | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2"
      register: inventory_ip
      changed_when: false

    - name: Set master IP fact
      ansible.builtin.set_fact:
        master_ip: "{{ inventory_ip.stdout }}"

    - name: Display configuration information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOY PROMTAIL LOG COLLECTOR (kubectl manifests)"
          - "================================================================"
          - ""
          - "This will deploy:"
          - "  - Promtail as DaemonSet (runs on all nodes)"
          - "  - Automatic log collection from all pods"
          - "  - Integration with Loki"
          - ""
          - "Features:"
          - "  - Collects all container logs"
          - "  - Adds Kubernetes metadata labels"
          - "  - Sends logs to Loki"
          - "  - Automatic service discovery"
          - ""
          - "================================================================"

    - name: Confirm action
      ansible.builtin.pause:
        prompt: |
          This will deploy Promtail log collector.

          Press Enter to continue or Ctrl+C to cancel.

- name: Deploy Promtail
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    loki_namespace: "monitoring"

  tasks:
    - name: Display deployment configuration
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOYING PROMTAIL"
          - "================================================================"
          - ""
          - "Namespace: {{ loki_namespace }}"
          - "Mode: DaemonSet (all nodes)"
          - "Target: Loki service"
          - ""

    # ============== CREATE PROMTAIL CONFIG ==============
    - name: Create Promtail ConfigMap
      ansible.builtin.copy:
        dest: /tmp/promtail-config.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: promtail-config
            namespace: {{ loki_namespace }}
            labels:
              app: promtail
          data:
            config.yml: |
              server:
                http_listen_port: 3101

              positions:
                filename: /tmp/positions.yaml

              clients:
                - url: http://loki.{{ loki_namespace }}.svc:3100/loki/api/v1/push

              scrape_configs:
                # Job for scraping Kubernetes pods
                - job_name: kubernetes-pods
                  kubernetes_sd_configs:
                    - role: pod
                  relabel_configs:
                    - source_labels:
                        - __meta_kubernetes_pod_controller_name
                      regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
                      action: labelmap
                      replacement: $1
                    - source_labels:
                        - __meta_kubernetes_pod_label_app
                      target_label: app
                      action: replace
                    - source_labels:
                        - __meta_kubernetes_pod_label_component
                      target_label: component
                      action: replace
                    - source_labels:
                        - __meta_kubernetes_pod_name
                      target_label: pod
                      action: replace
                    - source_labels:
                        - __meta_kubernetes_pod_namespace
                      target_label: namespace
                      action: replace
                    - source_labels:
                        - __meta_kubernetes_pod_node_name
                      target_label: node
                      action: replace
                    - source_labels:
                        - __meta_kubernetes_pod_container_name
                      target_label: container
                      action: replace
                    - source_labels:
                        - __meta_kubernetes_pod_uid
                      target_label: pod_uid
                      action: replace
                    # Keep only the pods from namespaces we care about (optional)
                    - source_labels:
                        - __meta_kubernetes_namespace
                      regex: (ajasta|monitoring|kube-system)
                      action: keep
                    # Fix __path__ to match actual Kubernetes log directory structure
                    # Structure: /var/log/pods/NAMESPACE_PODNAME_UID/CONTAINER/0.log
                    - source_labels:
                        - __meta_kubernetes_pod_name
                        - __meta_kubernetes_pod_container_name
                        - __meta_kubernetes_namespace
                        - __meta_kubernetes_pod_uid
                      separator: /
                      regex: (.*)/(.*)/(.*)/(.*)
                      replacement: /var/log/pods/${3}_${1}_${4}/${2}/0.log
                      target_label: __path__
                      action: replace

    - name: Display config creation status
      ansible.builtin.debug:
        msg: "✓ Promtail ConfigMap created"

    # ============== CREATE PROMTAIL DAEMONSET ==============
    - name: Create Promtail DaemonSet manifest
      ansible.builtin.copy:
        dest: /tmp/promtail-daemonset.yaml
        mode: '0644'
        content: |
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: promtail
            namespace: {{ loki_namespace }}
            labels:
              app: promtail
          spec:
            selector:
              matchLabels:
                app: promtail
            template:
              metadata:
                labels:
                  app: promtail
              spec:
                serviceAccountName: promtail
                containers:
                - name: promtail
                  image: grafana/promtail:2.9.10
                  args:
                    - "-config.file=/etc/promtail/config.yml"
                  env:
                  - name: HOSTNAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  ports:
                  - containerPort: 3101
                    name: http
                    protocol: TCP
                  resources:
                    limits:
                      cpu: 200m
                      memory: 128Mi
                    requests:
                      cpu: 100m
                      memory: 64Mi
                  volumeMounts:
                  - name: config
                    mountPath: /etc/promtail
                    readOnly: true
                  - name: varlog
                    mountPath: /var/log
                    readOnly: true
                  - name: varlibdockercontainers
                    mountPath: /var/lib/docker/containers
                    readOnly: true
                tolerations:
                - effect: NoSchedule
                  operator: Exists
                volumes:
                - name: config
                  configMap:
                    name: promtail-config
                - name: varlog
                  hostPath:
                    path: /var/log
                - name: varlibdockercontainers
                  hostPath:
                    path: /var/lib/docker/containers

    - name: Create Promtail ServiceAccount & RBAC
      ansible.builtin.copy:
        dest: /tmp/promtail-rbac.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: promtail
            namespace: {{ loki_namespace }}
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: promtail
            labels:
              app: promtail
          rules:
          - apiGroups: [""]
            resources:
            - nodes
            - nodes/proxy
            - services
            - endpoints
            - pods
            verbs:
            - get
            - list
            - watch
          - apiGroups:
            - extensions
            resources:
            - ingresses
            verbs:
            - get
            - list
            - watch
          - nonResourceURLs:
            - /metrics
            verbs:
            - get
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: promtail
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: promtail
          subjects:
          - kind: ServiceAccount
            name: promtail
            namespace: {{ loki_namespace }}

    - name: Display manifests creation
      ansible.builtin.debug:
        msg: "✓ Promtail manifests created"

    # ============== DEPLOY PROMTAIL ==============
    - name: Apply Promtail manifests
      ansible.builtin.shell:
        cmd: |
          kubectl apply -f /tmp/promtail-config.yaml
          kubectl apply -f /tmp/promtail-rbac.yaml
          kubectl apply -f /tmp/promtail-daemonset.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: promtail_deploy

    - name: Display Promtail deployment status
      ansible.builtin.debug:
        msg: "✓ Promtail deployed via kubectl"

    # ============== VERIFY PROMTAIL DEPLOYMENT ==============
    - name: Pause for Promtail to start
      ansible.builtin.pause:
        seconds: 20

    - name: Check Promtail pods
      ansible.builtin.shell:
        cmd: "kubectl get pods -n {{ loki_namespace }} -l app=promtail"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: promtail_pods

    - name: Display Promtail pods
      ansible.builtin.debug:
        msg: "{{ promtail_pods.stdout_lines }}"

    - name: Check Promtail logs
      ansible.builtin.shell:
        cmd: "kubectl logs -n {{ loki_namespace }} -l app=promtail --tail=10 --prefix=true"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: promtail_logs
      failed_when: false

    - name: Display Promtail logs
      ansible.builtin.debug:
        msg: "{{ promtail_logs.stdout_lines }}"

    # ============== CREATE ROLLBACK SCRIPT ==============
    - name: Create rollback script
      ansible.builtin.copy:
        dest: /tmp/rollback-promtail-kubectl.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Rollback script for Promtail deployment (kubectl)
          # Generated by: 24-deploy-promtail-kubectl.yml

          set -e

          NAMESPACE="{{ loki_namespace }}"

          echo "================================================================"
          echo "ROLLBACK PROMTAIL DEPLOYMENT"
          echo "================================================================"
          echo ""

          # Confirm rollback
          echo "This will:"
          echo "  Delete Promtail DaemonSet"
          echo "  Delete ServiceAccount and RBAC"
          echo "  Delete ConfigMap"
          echo ""
          read -p "Continue? (y/N) " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
            echo "Rollback cancelled"
            exit 0
          fi
          echo ""

          # Delete DaemonSet
          echo "Deleting Promtail DaemonSet..."
          kubectl delete daemonset promtail -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ DaemonSet deleted"
          echo ""

          # Delete RBAC
          echo "Deleting RBAC resources..."
          kubectl delete clusterrolebinding promtail 2>/dev/null || true
          kubectl delete clusterrole promtail 2>/dev/null || true
          kubectl delete serviceaccount promtail -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ RBAC deleted"
          echo ""

          # Delete ConfigMap
          echo "Deleting ConfigMap..."
          kubectl delete configmap promtail-config -n "$NAMESPACE" 2>/dev/null || true
          echo "✓ ConfigMap deleted"
          echo ""

          echo "================================================================"
          echo "ROLLBACK COMPLETE"
          echo "================================================================"
          echo ""
          echo "To re-deploy:"
          echo "  ansible-playbook -i inventory.ini 24-deploy-promtail-kubectl.yml"
          echo ""

    - name: Make rollback script executable
      ansible.builtin.shell:
        cmd: "chmod +x /tmp/rollback-promtail-kubectl.sh"
      changed_when: false

    # ============== DISPLAY SUMMARY ==============
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PROMTAIL DEPLOYMENT COMPLETE"
          - "================================================================"
          - ""
          - "✓ Promtail deployed successfully"
          - "✓ Running as DaemonSet on all nodes"
          - "✓ Collecting logs from all pods"
          - "✓ Sending logs to Loki"
          - ""
          - "LOG FLOW:"
          - "  Pods → Promtail → Loki → Grafana"
          - ""
          - "NEXT STEPS:"
          - "  1. Configure Grafana datasource: ansible-playbook -i inventory.ini 25-configure-grafana-loki.yml"
          - "  2. Deploy cAdvisor: ansible-playbook -i inventory.ini 26-deploy-cadvisor.yml"
          - "  3. View logs in Grafana"
          - ""
          - "USEFUL COMMANDS:"
          - "  kubectl get pods -n {{ loki_namespace }} -l app=promtail"
          - "  kubectl logs -n {{ loki_namespace }} -l app=promtail -f"
          - "  kubectl get configmap promtail-config -n {{ loki_namespace }} -o yaml"
          - ""
          - "ROLLBACK IF NEEDED:"
          - "  /tmp/rollback-promtail-kubectl.sh (on master node)"
          - ""
          - "================================================================"

- name: Final Instructions
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PROMTAIL LOG COLLECTOR READY"
          - "================================================================"
          - ""
          - "Promtail is now collecting logs from all pods!"
          - ""
          - "Next steps:"
          - ""
          - "1. Configure Grafana Loki datasource:"
          - "   ansible-playbook -i inventory.ini 25-configure-grafana-loki.yml"
          - ""
          - "2. Deploy cAdvisor (optional, for container metrics):"
          - "   ansible-playbook -i inventory.ini 26-deploy-cadvisor.yml"
          - ""
          - "3. View logs in Grafana → Explore"
          - ""
          - "================================================================"
