---
# Default variables for k8s_prerequisites role

# Disable swap
k8s_disable_swap: true

# Sysctl settings
k8s_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv4.conf.forwarding: 1
  net.ipv6.conf.all.forwarding: 1
  net.ipv6.conf.default.forwarding: 1
  net.netfilter.nf_conntrack_max: 262144
  fs.inotify.max_user_watches: 524288

# Kernel modules to load
k8s_kernel_modules:
  - overlay
  - br_netfilter
  - ip_tables
  - ip6_tables
  - ip_set
  - nf_conntrack
  - xt_conntrack

# Packages to install
k8s_required_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

# Disable firewall (configure properly for production!)
k8s_disable_firewall: true
