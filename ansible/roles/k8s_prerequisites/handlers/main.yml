---
# Handlers for k8s_prerequisites role

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart ufw
  ansible.builtin.service:
    name: ufw
    state: restarted
  when: ansible_os_family == "Debian"

- name: Restart firewalld
  ansible.builtin.service:
    name: firewalld
    state: restarted
  when: ansible_os_family == "RedHat"

- name: Update module dependencies
  ansible.builtin.command: depmod -a
  changed_when: true
