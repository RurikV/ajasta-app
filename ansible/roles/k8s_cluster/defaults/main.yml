---
# Default variables for k8s_cluster role

# Kubernetes version
kubernetes_version: "1.29.0"
kubernetes_version_prefix: "1.29"
kubernetes_package_version: "1.29.0-1.1"

# Kubernetes component versions
kubeadm_version: "{{ kubernetes_version }}"
kubelet_version: "{{ kubernetes_version }}"
kubectl_version: "{{ kubernetes_version }}"

# Cluster configuration
kubernetes_pod_network_cidr: "10.244.0.0/16"
kubernetes_service_subnet_cidr: "10.96.0.0/12"
kubernetes_dns_domain: "cluster.local"

# API Server
kubernetes_apiserver_bind_port: 6443
kubernetes_apiserver_advertise_address: "{{ ansible_default_ipv4.address }}"

# Control plane endpoint (for HA clusters)
kubernetes_control_plane_endpoint: ""

# Cluster name
kubernetes_cluster_name: "kubernetes"

# Kubelet configuration
kubelet_systemd_service: "/etc/systemd/system/kubelet.service.d/10-kubeadm.conf"

# Kubeconfig directories
kubernetes_kubeconfig_dir: "/etc/kubernetes"
kubernetes_kubelet_config_dir: "/var/lib/kubelet"

# Join token configuration
kubernetes_join_token_discovery_timeout: "5m"

# Node roles
kubernetes_node_role: "worker"  # Options: control-plane, worker

# Control plane configuration
kubernetes_control_plane_replicas: 1
kubernetes_load_balancer_domain: ""

# Worker configuration
kubernetes_worker_node_count: 0

# Network plugin (will be installed separately)
kubernetes_network_plugin: "cilium"

# Enable Kubernetes features
kubernetes_enable_pod_security_policy: false
kubernetes_enable_dynamic_audit_log: false

# API Server extra arguments
kubernetes_apiserver_extra_args: []

# Controller manager extra arguments
kubernetes_controller_extra_args: []

# Scheduler extra arguments
kubernetes_scheduler_extra_args: []

# Kubelet extra arguments
kubelet_extra_args: []

# Cloud provider configuration
kubernetes_cloud_provider: ""

# Container runtime
kubernetes_container_runtime: "containerd"
kubernetes_cri_socket: "/run/containerd/containerd.sock"

# Skip preflight checks (for debugging)
kubernetes_skip_preflight_checks: false

# Ignore preflight errors
kubernetes_ignore_preflight_errors: []

# Timeout for kubeadm commands
kubernetes_timeout: "5m"

# Retry settings
kubernetes_join_retries: 3
kubernetes_join_delay: 10

# Cleanup on failure
kubernetes_cleanup_on_failure: false

# Kubeadm init configuration template
kubernetes_use_custom_kubeadm_config: false

# Enable feature gates
kubernetes_feature_gates: []

# Etcd configuration
kubernetes_etcd_data_dir: "/var/lib/etcd"

# Logs directories
kubernetes_log_dir: "/var/log/kubernetes"
kubernetes_manifest_dir: "/etc/kubernetes/manifests"

# Certificate directory
kubernetes_cert_dir: "/etc/kubernetes/pki"

# Authorization modes
kubernetes_authorization_modes: "Node,RBAC"

# Add-on deployment
kubernetes_deploy_metrics_server: false
kubernetes_deploy_dashboard: false

# Cluster initialization
kubernetes_init_control_plane: false  # Only one node should init
kubernetes_join_cluster: false         # Worker nodes should join

# Master node configuration
kubernetes_master_node_name: "{{ ansible_hostname }}"
kubernetes_master_node_ip: "{{ ansible_default_ipv4.address }}"

# Join token (will be generated by control plane)
kubernetes_join_token: ""
kubernetes_discovery_token_ca_cert_hash: ""
