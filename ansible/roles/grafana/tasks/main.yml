                "id": 3,
                "options": {
                  "legend": {"calcs": ["mean"], "displayMode": "list", "placement": "bottom"},
                  "tooltip": {"mode": "single"}
                },
                "targets": [
                  {
                    "expr": "rate(ajasta_http_server_requests_seconds_count{status=~\"5..\"}[5m]) / rate(ajasta_http_server_requests_seconds_count[5m]) * 100",
                    "legendFormat": "Error Rate",
                    "refId": "A"
