                  {
                    "expr": "ajasta_hikari_connections_idle",
                    "legendFormat": "Idle Connections",
                    "refId": "B"
                  },
                  {
                    "expr": "ajasta_hikari_connections_max",
                    "legendFormat": "Max Connections",
                    "refId": "C"
                  }
                ],
                "title": "Database Connection Pool",
                "type": "timeseries"
              }
            ],
            "refresh": "5s",
            "schemaVersion": 27,
            "style": "dark",
            "tags": ["ajasta", "backend", "spring-boot"],
            "templating": {"list": []},
            "time": {"from": "now-1h", "to": "now"},
            "timepicker": {},
            "timezone": "",
            "title": "{{ ajasta_dashboard_name }}",
            "uid": "ajasta-backend",
            "version": 1
          }
  when: ajasta_dashboard_enabled | bool

