      metadata:
        name: ajasta-backend-dashboard
        namespace: "{{ kubernetes_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        ajasta-backend-dashboard.json: |
          {
            "annotations": {
              "list": [{}]
            },
            "editable": true,
            "gnetId": null,
            "graphTooltip": 0,
            "id": null,
            "links": [],
            "panels": [
              {
                "datasource": "Prometheus",
                "fieldConfig": {
                  "defaults": {
                    "color": {"mode": "palette-classic"},
                    "custom": {
                      "axisLabel": "",
                      "axisPlacement": "auto",
                      "barAlignment": 0,
                      "drawStyle": "line",
                      "fillOpacity": 10,
                      "gradientMode": "none",
                      "hideFrom": {"tooltip": false, "viz": false, "legend": false},
                      "lineInterpolation": "linear",
                      "lineWidth": 1,
                      "pointSize": 5,
                      "scaleDistribution": {"type": "linear"},
                      "showPoints": "never",
                      "spanNulls": false
                    },
                    "mappings": [],
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]
                    },
                    "unit": "reqps"
                  },
                  "overrides": []
                },
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
                "id": 1,
                "options": {
                  "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
                  "tooltip": {"mode": "single"}
                },
                "pluginVersion": "8.0.0",
                "targets": [
                  {
                    "expr": "rate(ajasta_http_server_requests_seconds_count[5m])",
                    "legendFormat": "{{method}} {{uri}}",
                    "refId": "A"
                  }
                ],
                "title": "Request Rate",
