---
- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kubernetes_namespace }}"
        labels:
          name: monitoring

- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ grafana_helm_repo }}"

- name: Create Grafana admin password secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ grafana_name }}-admin"
        namespace: "{{ kubernetes_namespace }}"
        labels:
          app: grafana
      type: Opaque
      stringData:
        admin-user: "{{ grafana_admin_user }}"
        admin-password: "{{ grafana_admin_password }}"

- name: Deploy Grafana with Helm
  kubernetes.core.helm:
    name: "{{ helm_release_name }}"
    chart_ref: grafana/grafana
    chart_version: "{{ grafana_helm_version }}"
    release_namespace: "{{ kubernetes_namespace }}"
    create_namespace: true
    values: "{{ grafana_helm_values }}"
    timeout: "{{ helm_timeout }}"
  register: grafana_deploy_result

- name: Create Grafana persistent volume claim
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ grafana_name }}-storage"
        namespace: "{{ kubernetes_namespace }}"
        labels:
          app: grafana
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ grafana_storage_size }}"
        storageClassName: "{{ grafana_storage_class }}"
  when: grafana_storage_enabled | bool

- name: Create ConfigMap for custom dashboards
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: custom-dashboards
        namespace: "{{ kubernetes_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        ajasta-backend.json: |
          {{ lookup('template', 'dashboards/ajasta-backend.json.j2') | string }}

  when: custom_dashboards_enabled | bool
  ignore_errors: true

# Ajasta Backend Dashboard
