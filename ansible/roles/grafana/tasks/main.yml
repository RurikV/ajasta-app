# Create Ingress for Grafana
- name: Create Grafana Ingress
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: grafana-ingress
        namespace: "{{ kubernetes_namespace }}"
        labels:
          app: grafana
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: "20m"
      spec:
        ingressClassName: "{{ grafana_ingress_class_name }}"
        rules:
          - host: "{{ grafana_ingress_host }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ grafana_name }}"
                      port:
                        number: {{ grafana_service_port }}
        tls:
          - hosts:
              - "{{ grafana_ingress_host }}"
            secretName: "{{ grafana_ingress_tls_secret }}"
  when: grafana_ingress_enabled | bool

# Wait for Grafana deployment to be ready
- name: Wait for Grafana deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ grafana_name }}"
    namespace: "{{ kubernetes_namespace }}"
  register: grafana_status
  until:
    - grafana_status.resources[0].status.availableReplicas is defined
    - grafana_status.resources[0].status.availableReplicas >= 1
  retries: 30
  delay: 10
  ignore_errors: true

- name: Display deployment status
  ansible.builtin.debug:
    msg:
      - "Grafana deployed successfully"
      - "URL: https://{{ grafana_ingress_host }}"
      - "Username: {{ grafana_admin_user }}"
      - "Password: {{ grafana_admin_password }}"
      - "Namespace: {{ kubernetes_namespace }}"
      - "Dashboards: {{ grafana_dashboards | length }} pre-configured"
