---
# Handlers for containerd role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true

- name: Start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Stop containerd
  ansible.builtin.systemd:
    name: containerd
    state: stopped
