---
# Molecule verify playbook for containerd role

- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Check if containerd binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/containerd
      register: containerd_binary

    - name: Verify containerd binary exists
      ansible.builtin.assert:
        that:
          - containerd_binary.stat.exists
        fail_msg: "containerd binary not found"
        success_msg: "containerd binary exists"

    - name: Check containerd version
      ansible.builtin.command: containerd --version
      register: containerd_version
      changed_when: false

    - name: Display containerd version
      ansible.builtin.debug:
        msg: "{{ containerd_version.stdout }}"

    - name: Check if containerd service is enabled
      ansible.builtin.systemd:
        name: containerd
      register: containerd_service

    - name: Verify containerd service is running
      ansible.builtin.shell: |
        systemctl is-active containerd
      register: containerd_active
      changed_when: false

    - name: Assert containerd is active
      ansible.builtin.assert:
        that:
          - containerd_active.stdout == "active"
        fail_msg: "containerd service is not active"
        success_msg: "containerd service is active"

    - name: Check if CNI plugins directory exists
      ansible.builtin.stat:
        path: /opt/cni/bin
      register: cni_dir

    - name: Verify CNI plugins directory exists
      ansible.builtin.assert:
        that:
          - cni_dir.stat.exists
          - cni_dir.stat.isdir
        fail_msg: "CNI plugins directory does not exist"
        success_msg: "CNI plugins directory exists"

    - name: Check if CNI plugins are installed
      ansible.builtin.find:
        paths: /opt/cni/bin
        patterns: "*"
      register: cni_plugins

    - name: Verify CNI plugins are installed
      ansible.builtin.assert:
        that:
          - cni_plugins.matched > 0
        fail_msg: "No CNI plugins found"
        success_msg: "{{ cni_plugins.matched }} CNI plugins installed"

    - name: Check if containerd config exists
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Verify containerd configuration exists
      ansible.builtin.assert:
        that:
          - containerd_config.stat.exists
        fail_msg: "containerd configuration file does not exist"
        success_msg: "containerd configuration file exists"

    - name: Test containerd can pull images
      ansible.builtin.command: ctr version
      register: ctr_version
      changed_when: false
      retries: 3
      delay: 2
      until: ctr_version.rc == 0

    - name: Verify ctr is working
      ansible.builtin.assert:
        that:
          - ctr_version.rc == 0
        fail_msg: "ctr command failed"
        success_msg: "ctr command is working"
