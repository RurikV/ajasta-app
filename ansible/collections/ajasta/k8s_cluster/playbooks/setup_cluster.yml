---
# Complete Kubernetes cluster deployment playbook
# This playbook deploys a complete Kubernetes cluster with control plane and worker nodes

- name: Prepare all Kubernetes nodes
  hosts: k8s_nodes
  become: yes
  gather_facts: true
  roles:
    - role: k8s_prerequisites
      tags:
        - prerequisites
        - prepare

    - role: containerd
      tags:
        - containerd
        - runtime

- name: Initialize Kubernetes control plane
  hosts: k8s_control_plane
  become: yes
  gather_facts: true
  roles:
    - role: k8s_cluster
      vars:
        kubernetes_init_control_plane: true
        kubernetes_pod_network_cidr: "10.244.0.0/16"
        kubernetes_service_subnet_cidr: "10.96.0.0/12"
      tags:
        - control-plane
        - master

- name: Get join command from control plane
  hosts: k8s_control_plane
  become: yes
  gather_facts: false
  tasks:
    - name: Fetch join command
      ansible.builtin.slurp:
        src: /tmp/kubernetes-join-command.sh
      register: join_command
      delegate_to: localhost
      run_once: true

    - name: Save join command to file
      ansible.builtin.copy:
        content: "{{ join_command.content | b64decode }}"
        dest: /tmp/kubernetes-join-command.sh
        mode: '0755'
      delegate_to: localhost
      run_once: true
      tags:
        - join
        - workers

- name: Join worker nodes to cluster
  hosts: k8s_workers
  become: yes
  gather_facts: true
  tasks:
    - name: Copy join command to worker nodes
      ansible.builtin.copy:
        src: /tmp/kubernetes-join-command.sh
        dest: /tmp/kubernetes-join-command.sh
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Execute join command on worker nodes
      ansible.builtin.shell: /tmp/kubernetes-join-command.sh
      register: join_result
      until: join_result.rc == 0
      retries: 3
      delay: 10
      tags:
        - join
        - workers

    - name: Wait for nodes to become ready
      ansible.builtin.pause:
        seconds: 30
      tags:
        - join
        - workers

- name: Verify cluster status
  hosts: k8s_control_plane
  become: yes
  gather_facts: false
  tasks:
    - name: Get cluster nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false
      tags:
        - verify
        - status

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
      tags:
        - verify
        - status

    - name: Get cluster info
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      tags:
        - verify
        - status

    - name: Display cluster info
      ansible.builtin.debug:
        msg: "{{ cluster_info.stdout_lines }}"
      tags:
        - verify
        - status

    - name: Get system pods
      ansible.builtin.command: kubectl get pods -n kube-system
      register: system_pods
      changed_when: false
      tags:
        - verify
        - status

    - name: Display system pods
      ansible.builtin.debug:
        msg: "{{ system_pods.stdout_lines }}"
      tags:
        - verify
        - status
