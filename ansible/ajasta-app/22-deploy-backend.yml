---
# Deploy Ajasta Backend API
# This playbook deploys the Spring Boot backend for Ajasta application
# Usage:
#   ansible-playbook -i ../k8s/inventory.ini 22-deploy-backend.yml

- name: Deploy Ajasta Backend API
  hosts: k8s_master
  become: yes
  gather_facts: yes

  vars:
    # Namespace
    namespace: ajasta

    # Backend configuration
    backend_enabled: true
    backend_image: vladimirryrik/ajasta-backend
    backend_tag: alpine
    backend_replicas: 1
    backend_port: 8090

    # PostgreSQL configuration
    pg_cluster_name: cluster-postgresql
    pg_namespace: postgresql-cluster
    pg_database: ajastadb

    # Resource configuration
    cpu_request: 500m
    cpu_limit: 1000m
    memory_request: 512Mi
    memory_limit: 1Gi

    # Secrets configuration (CHANGE IN PRODUCTION!)
    jwt_secret: change-me-production-secret-key
    db_password: autogenerated-by-cnpg
    mail_username: ""
    mail_password: ""
    aws_access_key_id: ""
    aws_secret_access_key: ""
    stripe_public_key: ""
    stripe_secret_key: ""

    # Application configuration
    aws_region: us-east-1
    aws_s3_bucket: ""
    java_opts: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  tasks:
    - name: Display backend deployment information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOYING AJASTA BACKEND API"
          - "================================================================"
          - ""
          - "Backend Configuration:"
          - "  - Image: {{ backend_image }}:{{ backend_tag }}"
          - "  - Replicas: {{ backend_replicas }}"
          - "  - Port: {{ backend_port }}"
          - "  - Namespace: {{ namespace }}"
          - ""
          - "Database Connection:"
          - "  - PostgreSQL Cluster: {{ pg_cluster_name }}"
          - "  - PostgreSQL Namespace: {{ pg_namespace }}"
          - "  - Database: {{ pg_database }}"
          - "  - Service: {{ pg_cluster_name }}-rw.{{ pg_namespace }}.svc"
          - ""
          - "Resources:"
          - "  - CPU: {{ cpu_request }} / {{ cpu_limit }}"
          - "  - Memory: {{ memory_request }} / {{ memory_limit }}"
          - ""
          - "================================================================"

    # ==============================================================
    # PART 1: CREATE NAMESPACE
    # ==============================================================

    - name: Display namespace creation message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 1: CREATING NAMESPACE"
          - "================================================================"

    - name: Create ajasta namespace
      ansible.builtin.shell:
        cmd: kubectl create namespace {{ namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: namespace_create

    - name: Display namespace creation result
      ansible.builtin.debug:
        msg: "{{ namespace_create.stdout_lines }}"

    # ==============================================================
    # PART 2: CREATE SECRETS
    # ==============================================================

    - name: Display secrets creation message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 2: CREATING SECRETS"
          - "================================================================"

    - name: Get PostgreSQL app user password from secret
      ansible.builtin.shell:
        cmd: kubectl get secret {{ pg_cluster_name }}-app -n {{ pg_namespace }} -o jsonpath='{.data.password}' | base64 -d
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: pg_password
      changed_when: false
      failed_when: false

    - name: Display PostgreSQL password retrieval
      ansible.builtin.debug:
        msg: "{{ 'PostgreSQL password retrieved' if pg_password.rc == 0 else 'PostgreSQL password not found, using default' }}"

    - name: Create backend secret
      ansible.builtin.copy:
        dest: /tmp/backend-secret.yaml
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: backend-secret
            namespace: {{ namespace }}
            labels:
              app: ajasta
              component: backend
          type: Opaque
          stringData:
            # Database credentials
            DB_PASSWORD: "{{ pg_password.stdout if pg_password.rc == 0 else db_password }}"

            # JWT secret
            JWT_SECRET: "{{ jwt_secret }}"

            # Mail configuration (optional)
            MAIL_USERNAME: "{{ mail_username }}"
            MAIL_PASSWORD: "{{ mail_password }}"

            # AWS configuration (optional)
            AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"

            # Stripe configuration (optional)
            STRIPE_PUBLIC_KEY: "{{ stripe_public_key }}"
            STRIPE_SECRET_KEY: "{{ stripe_secret_key }}"
        mode: '0644'

    - name: Apply backend secret
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/backend-secret.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: secret_apply

    - name: Display secret creation
      ansible.builtin.debug:
        msg: "{{ secret_apply.stdout_lines }}"

    # ==============================================================
    # PART 3: CREATE CONFIGMAP
    # ==============================================================

    - name: Display configmap creation message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 3: CREATING CONFIGMAP"
          - "================================================================"

    - name: Create backend configmap
      ansible.builtin.copy:
        dest: /tmp/backend-configmap.yaml
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: backend-config
            namespace: {{ namespace }}
            labels:
              app: ajasta
              component: backend
          data:
            # Database connection
            DB_URL: "jdbc:postgresql://{{ pg_cluster_name }}-rw.{{ pg_namespace }}.svc:5432/{{ pg_database }}"
            DB_USERNAME: "app"

            # AWS configuration
            AWS_REGION: "{{ aws_region }}"
            AWS_S3_BUCKET: "{{ aws_s3_bucket }}"

            # JVM options
            JAVA_OPTS: "{{ java_opts }}"
        mode: '0644'

    - name: Apply backend configmap
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/backend-configmap.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: configmap_apply

    - name: Display configmap creation
      ansible.builtin.debug:
        msg: "{{ configmap_apply.stdout_lines }}"

    # ==============================================================
    # PART 4: CREATE DEPLOYMENT
    # ==============================================================

    - name: Display deployment creation message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 4: CREATING BACKEND DEPLOYMENT"
          - "================================================================"

    - name: Create backend deployment
      ansible.builtin.copy:
        dest: /tmp/backend-deployment.yaml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ajasta-backend
            namespace: {{ namespace }}
            labels:
              app: ajasta
              component: backend
          spec:
            replicas: {{ backend_replicas }}
            selector:
              matchLabels:
                app: ajasta
                component: backend
            template:
              metadata:
                labels:
                  app: ajasta
                  component: backend
              spec:
                # Node affinity to avoid control-plane nodes
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist

                containers:
                - name: backend
                  image: {{ backend_image }}:{{ backend_tag }}
                  imagePullPolicy: IfNotPresent
                  ports:
                  - name: http
                    containerPort: {{ backend_port }}
                    protocol: TCP

                  # Environment variables
                  env:
                  # Database connection from ConfigMap
                  - name: DB_URL
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: DB_URL
                  - name: DB_USERNAME
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: DB_USERNAME
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: DB_PASSWORD

                  # JWT secret
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: JWT_SECRET

                  # Mail configuration
                  - name: MAIL_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: MAIL_USERNAME
                  - name: MAIL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: MAIL_PASSWORD

                  # AWS configuration
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: AWS_ACCESS_KEY_ID
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: AWS_SECRET_ACCESS_KEY
                  - name: AWS_REGION
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: AWS_REGION
                  - name: AWS_S3_BUCKET
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: AWS_S3_BUCKET

                  # Stripe configuration
                  - name: STRIPE_PUBLIC_KEY
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: STRIPE_PUBLIC_KEY
                  - name: STRIPE_SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: backend-secret
                        key: STRIPE_SECRET_KEY

                  # JVM options
                  - name: JAVA_OPTS
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: JAVA_OPTS

                  # Liveness probe
                  livenessProbe:
                    tcpSocket:
                      port: {{ backend_port }}
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 3

                  # Readiness probe
                  readinessProbe:
                    tcpSocket:
                      port: {{ backend_port }}
                    initialDelaySeconds: 60
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 6

                  # Resource limits
                  resources:
                    requests:
                      cpu: {{ cpu_request }}
                      memory: {{ memory_request }}
                      ephemeral-storage: "1Gi"
                    limits:
                      cpu: {{ cpu_limit }}
                      memory: {{ memory_limit }}
                      ephemeral-storage: "2Gi"
        mode: '0644'

    - name: Apply backend deployment
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/backend-deployment.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: deployment_apply

    - name: Display backend deployment
      ansible.builtin.debug:
        msg: "{{ deployment_apply.stdout_lines }}"

    # ==============================================================
    # PART 5: CREATE SERVICE
    # ==============================================================

    - name: Display service creation message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 5: CREATING BACKEND SERVICE"
          - "================================================================"

    - name: Create backend service
      ansible.builtin.copy:
        dest: /tmp/backend-service.yaml
        content: |
          apiVersion: v1
          kind: Service
          metadata:
            name: ajasta-backend
            namespace: {{ namespace }}
            labels:
              app: ajasta
              component: backend
          spec:
            type: ClusterIP
            selector:
              app: ajasta
              component: backend
            ports:
            - name: http
              protocol: TCP
              port: {{ backend_port }}
              targetPort: {{ backend_port }}
        mode: '0644'

    - name: Apply backend service
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/backend-service.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: service_apply

    - name: Display backend service creation
      ansible.builtin.debug:
        msg: "{{ service_apply.stdout_lines }}"

    # ==============================================================
    # PART 6: VERIFICATION
    # ==============================================================

    - name: Display verification message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 6: VERIFYING BACKEND DEPLOYMENT"
          - "================================================================"

    - name: Pause for deployment to rollout
      ansible.builtin.pause:
        seconds: 10

    - name: Wait for backend deployment to be ready
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/ajasta-backend -n {{ namespace }} --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: rollout_wait
      until: rollout_wait.rc == 0
      retries: 30
      delay: 5

    - name: Get backend pods
      ansible.builtin.command:
        cmd: kubectl get pods -n {{ namespace }} -l component=backend
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: backend_pods
      changed_when: false

    - name: Display backend pods
      ansible.builtin.debug:
        msg: "{{ backend_pods.stdout_lines }}"

    - name: Get backend service
      ansible.builtin.command:
        cmd: kubectl get svc -n {{ namespace }} ajasta-backend
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: backend_service
      changed_when: false

    - name: Display backend service
      ansible.builtin.debug:
        msg: "{{ backend_service.stdout_lines }}"

    - name: Check backend logs
      ansible.builtin.command:
        cmd: kubectl logs -n {{ namespace }} -l component=backend --tail=20
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: backend_logs
      changed_when: false
      failed_when: false

    - name: Display backend logs
      ansible.builtin.debug:
        msg: "{{ backend_logs.stdout_lines }}"

    # ==============================================================
    # PART 7: SUMMARY
    # ==============================================================

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "BACKEND API DEPLOYMENT COMPLETE"
          - "================================================================"
          - ""
          - "Configuration:"
          - "  - Image: {{ backend_image }}:{{ backend_tag }}"
          - "  - Replicas: {{ backend_replicas }}"
          - "  - Namespace: {{ namespace }}"
          - ""
          - "Service:"
          - "  - Name: ajasta-backend"
          - "  - Type: ClusterIP"
          - "  - Port: {{ backend_port }}"
          - "  - Internal URL: ajasta-backend.{{ namespace }}.svc:{{ backend_port }}"
          - ""
          - "Database Connection:"
          - "  - PostgreSQL: {{ pg_cluster_name }}-rw.{{ pg_namespace }}.svc"
          - "  - Database: {{ pg_database }}"
          - "  - User: app"
          - ""
          - "Useful Commands:"
          - "  kubectl get pods -n {{ namespace }} -l component=backend"
          - "  kubectl get svc -n {{ namespace }} ajasta-backend"
          - "  kubectl logs -n {{ namespace }} -l component=backend --tail=50 -f"
          - "  kubectl exec -it -n {{ namespace }} <pod> -- sh"
          - ""
          - "Test Backend API:"
          - "  kubectl port-forward -n {{ namespace }} svc/ajasta-backend 8090:{{ backend_port }}"
          - "  curl http://localhost:8090/api/health"
          - ""
          - "================================================================"

- name: Final summary
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "BACKEND API READY"
          - "================================================================"
          - ""
          - "Your Ajasta Backend API is now running!"
          - ""
          - "Next Steps:"
          - "  1. Deploy Frontend"
          - "  2. Configure Ingress"
          - "  3. Test the complete application"
          - ""
          - "================================================================"
