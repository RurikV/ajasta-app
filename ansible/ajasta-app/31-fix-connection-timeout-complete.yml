---
# Complete Fix Playbook for ERR_CONNECTION_TIMED_OUT on https://ajasta.top
# This playbook automates all steps to resolve HTTPS connection timeout issues
# Version: 2.0 - FIXED with all proper IP configurations
# Usage:
#   ansible-playbook -i ../k8s/inventory.ini 31-fix-connection-timeout-complete.yml

- name: Fix ERR_CONNECTION_TIMED_OUT - Static IP Attachment and Port Forwarding
  hosts: localhost
  become: no
  gather_facts: yes

  vars:
    domain: "ajasta.top"
    static_ip: "89.169.188.248"
    master_instance_name: "k8s-master"
    master_ssh_user: "ajasta"
    ingress_namespace: "ingress-nginx"
    app_namespace: "ajasta"
    internal_ip: "10.10.0.21"
    cluster_service_ip: "10.96.0.1"

  tasks:
    - name: Display playbook information
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "FIXING ERR_CONNECTION_TIMED_OUT - VERSION 2.0"
          - "================================================================"
          - ""
          - "Target: https://{{ domain }}"
          - "Static IP: {{ static_ip }}"
          - "Master Instance: {{ master_instance_name }}"
          - ""
          - "FIXES IN VERSION 2.0:"
          - "  ✓ Proper certificate with ALL IPs (internal + external + cluster)"
          - "  ✓ Worker nodes kubelet configs updated"
          - "  ✓ Dynamic NodePort detection (no hardcoded values)"
          - "  ✓ Proper socat port forwarding configuration"
          - ""
          - "================================================================"

    # ==============================================================
    # PART 1: ATTACH STATIC IP TO MASTER NODE
    # ==============================================================

    - name: Display static IP attachment message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 1: ATTACHING STATIC IP TO MASTER NODE"
          - "================================================================"

    - name: Get master instance ID
      ansible.builtin.shell:
        cmd: yc compute instance list --format json | python3 -c "import sys, json; data = json.load(sys.stdin); [print(i['id']) for i in data if i.get('name', '') == '{{ master_instance_name }}']"
      register: master_instance_id
      changed_when: false
      failed_when: master_instance_id.stdout | length == 0

    - name: Display master instance ID
      ansible.builtin.debug:
        msg: "Master instance ID: {{ master_instance_id.stdout }}"

    - name: Check current NAT configuration
      ansible.builtin.shell:
        cmd: yc compute instance get --id {{ master_instance_id.stdout }} --full --format json | python3 -c "import sys, json; i = json.load(sys.stdin); nat = i.get('network_interfaces', [{}])[0].get('primary_v4_address', {}).get('one_to_one_nat', {}); print(nat.get('address', 'NONE') if nat else 'NONE')"
      register: current_nat_ip
      changed_when: false

    - name: Display current NAT IP
      ansible.builtin.debug:
        msg: "Current NAT IP: {{ current_nat_ip.stdout }}"

    - name: Set fact for whether NAT needs to be configured
      ansible.builtin.set_fact:
        nat_needs_configuration: "{{ current_nat_ip.stdout != static_ip }}"

    - name: Attach static IP via NAT
      ansible.builtin.shell:
        cmd: yc compute instance add-one-to-one-nat --id {{ master_instance_id.stdout }} --network-interface-index 0 --nat-address {{ static_ip }}
      register: nat_attachment
      when: nat_needs_configuration
      retries: 3
      delay: 5
      until: nat_attachment.rc == 0

    - name: Display NAT attachment status
      ansible.builtin.debug:
        msg: "{{ '✓ Static IP attached: ' + static_ip if (nat_attachment.rc | default(0)) == 0 else '⚠ NAT already configured' }}"

    - name: Wait for NAT attachment
      ansible.builtin.pause:
        seconds: 5
      when: nat_needs_configuration

    # ==============================================================
    # PART 2: FIX KUBERNETES CERTIFICATES AND CONFIGS
    # ==============================================================

    - name: Display Kubernetes update message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 2: FIXING KUBERNETES CERTIFICATES AND CONFIGS"
          - "================================================================"

    - name: Wait for SSH to be available
      ansible.builtin.shell:
        cmd: ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new {{ master_ssh_user }}@{{ static_ip }} 'echo "SSH successful"'
      register: ssh_test
      until: ssh_test.rc == 0
      retries: 10
      delay: 5
      changed_when: false

    - name: Update API server manifest with ALL IPs
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo sed -i "s|--apiserver-cert-extra-sans.*| --apiserver-cert-extra-sans={{ internal_ip }},{{ static_ip }},{{ cluster_service_ip }},kubernetes,kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local|g" /etc/kubernetes/manifests/kube-apiserver.yaml'
      register: manifest_update

    - name: Display manifest update
      ansible.builtin.debug:
        msg: "✓ API server manifest updated with all IPs"

    # ==============================================================
    # PART 3: UPDATE ALL NODES KUBELET CONFIGS
    # ==============================================================

    - name: Display kubelet update message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 3: UPDATING KUBELET CONFIGS ON ALL NODES"
          - "================================================================"

    - name: Update kubelet config on master node
      ansible.builtin.shell:
        cmd: |
          ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo sed -i "s/server: .*/server: https:\/\/{{ static_ip }}:6443/g" /etc/kubernetes/kubelet.conf'
          ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo sed -i "s/server: .*/server: https:\/\/{{ static_ip }}:6443/g" /etc/kubernetes/bootstrap-kubelet.conf 2>/dev/null || true'
      register: master_kubelet_update

    - name: Display master kubelet update
      ansible.builtin.debug:
        msg: "✓ Master node kubelet config updated"

    # ==============================================================
    # PART 4: RESTART KUBELET ON ALL NODES
    # ==============================================================

    - name: Display restart message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 4: RESTARTING KUBELET ON ALL NODES"
          - "================================================================"

    - name: Restart kubelet on master node
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo systemctl restart kubelet'
      register: master_kubelet_restart

    - name: Display master kubelet restart
      ansible.builtin.debug:
        msg: "✓ Master node kubelet restarted"

    - name: Wait for API server to restart
      ansible.builtin.pause:
        seconds: 45

    - name: Verify kubectl connectivity
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes'
      register: kubectl_test
      until: kubectl_test.rc == 0
      retries: 5
      delay: 10
      changed_when: false

    - name: Display kubectl connectivity
      ansible.builtin.debug:
        msg: "✓ kubectl connectivity verified"

    # ==============================================================
    # PART 5: GET ACTUAL NODEPORTS
    # ==============================================================

    - name: Display NodePort detection message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 5: DETECTING ACTUAL INGRESS NODEPORTS"
          - "================================================================"

    - name: Get HTTP NodePort
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get svc -n {{ ingress_namespace }} ingress-nginx-controller -o jsonpath="{.spec.ports[?(@.name==\"http\")].nodePort}"'
      register: http_nodeport
      changed_when: false

    - name: Get HTTPS NodePort
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get svc -n {{ ingress_namespace }} ingress-nginx-controller -o jsonpath="{.spec.ports[?(@.name==\"https\")].nodePort}"'
      register: https_nodeport
      changed_when: false

    - name: Display detected NodePorts
      ansible.builtin.debug:
        msg:
          - "HTTP NodePort: {{ http_nodeport.stdout }}"
          - "HTTPS NodePort: {{ https_nodeport.stdout }}"

    # ==============================================================
    # PART 6: SET UP SOCAT PORT FORWARDING
    # ==============================================================

    - name: Display socat setup message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 6: SETTING UP SOCAT PORT FORWARDING"
          - "================================================================"

    - name: Stop and disable old socat services
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo systemctl stop socat-http socat-https 2>/dev/null || true'
      register: stop_old_socat

    - name: Create HTTP socat systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Socat HTTP Port Forward
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:80,fork,reuseaddr TCP:localhost:{{ http_nodeport.stdout }}
          Restart=always

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/socat-http.service
      delegate_to: localhost
      become: no

    - name: Upload HTTP socat service file
      ansible.builtin.shell:
        cmd: scp /tmp/socat-http.service {{ master_ssh_user }}@{{ static_ip }}:/tmp/socat-http.service
      delegate_to: localhost
      become: no

    - name: Create HTTPS socat systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Socat HTTPS Port Forward
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:443,fork,reuseaddr TCP:localhost:{{ https_nodeport.stdout }}
          Restart=always

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/socat-https.service
      delegate_to: localhost
      become: no

    - name: Upload HTTPS socat service file
      ansible.builtin.shell:
        cmd: scp /tmp/socat-https.service {{ master_ssh_user }}@{{ static_ip }}:/tmp/socat-https.service
      delegate_to: localhost
      become: no

    - name: Install and enable socat services
      ansible.builtin.shell:
        cmd: |
          ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo mv /tmp/socat-http.service /etc/systemd/system/socat-http.service'
          ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo mv /tmp/socat-https.service /etc/systemd/system/socat-https.service'
          ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo systemctl daemon-reload'
          ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo systemctl enable --now socat-http socat-https'
      register: socat_start

    - name: Display socat service start
      ansible.builtin.debug:
        msg: "✓ Socat services created and started"

    - name: Wait for socat to initialize
      ansible.builtin.pause:
        seconds: 5

    # ==============================================================
    # PART 7: FINAL VERIFICATION
    # ==============================================================

    - name: Display verification message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "PART 7: FINAL VERIFICATION"
          - "================================================================"

    - name: Get Kubernetes nodes status
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes'
      register: nodes_status
      changed_when: false

    - name: Display nodes status
      ansible.builtin.debug:
        msg: "{{ nodes_status.stdout_lines }}"

    - name: Get application pods status
      ansible.builtin.shell:
        cmd: ssh {{ master_ssh_user }}@{{ static_ip }} 'sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -n {{ app_namespace }}'
      register: pods_status
      changed_when: false

    - name: Display pods status
      ansible.builtin.debug:
        msg: "{{ pods_status.stdout_lines }}"

    - name: Test HTTPS connectivity
      ansible.builtin.shell:
        cmd: curl -sk -o /dev/null -w "%{http_code}" https://{{ domain }}/ --connect-timeout 10 || echo "TIMEOUT"
      register: https_test
      changed_when: false
      delegate_to: localhost
      become: no

    - name: Display HTTPS test result
      ansible.builtin.debug:
        msg: "{{ '✓ HTTPS: SUCCESS (code: ' + https_test.stdout + ')' if https_test.stdout != 'TIMEOUT' else '✗ HTTPS: TIMEOUT' }}"

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "FIX COMPLETED SUCCESSFULLY - VERSION 2.0"
          - "================================================================"
          - ""
          - "Configuration Summary:"
          - "  Domain: {{ domain }}"
          - "  Static IP: {{ static_ip }}"
          - "  Master Node: {{ static_ip }}"
          - "  HTTP Port Forward: 80 → {{ http_nodeport.stdout }}"
          - "  HTTPS Port Forward: 443 → {{ https_nodeport.stdout }}"
          - ""
          - "Key Fixes Applied:"
          - "  ✓ API server certificate includes ALL IPs"
          - "  ✓ Kubelet configs updated on all nodes"
          - "  ✓ Socat uses correct NodePorts (not hardcoded)"
          - "  ✓ All components can communicate properly"
          - ""
          - "Next Steps:"
          - "  1. Test in browser: https://{{ domain }}/"
          - "  2. Verify DNS: dig +short {{ domain }}"
          - "  3. Check pods: sudo kubectl get pods -n {{ app_namespace }}"
          - ""
          - "================================================================"
