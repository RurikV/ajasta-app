#cloud-config
# Cloud-init configuration for Ajasta Application Deployment
# This script installs Docker and deploys the Ajasta application

package_update: true
package_upgrade: true
package_reboot_if_required: false

# Install required packages
packages:
  - docker.io
  - docker-compose
  - curl
  - wget
  - unzip
  - htop
  - nano

# Create directories
mkdir:
  - /opt/ajasta-app
  - /opt/ajasta-app/logs
  - /opt/ajasta-app/data
  - /opt/ajasta-app/configs

# Add users to docker group
system_info:
  default_user:
    name: ajasta
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]

# Write configuration files
write_files:
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true
      }

  - path: /opt/ajasta-app/docker-compose.yml
    permissions: '0644'
    content: |
      version: '3.8'

      services:
        postgres:
          image: postgres:16-alpine
          container_name: ajasta-postgres
          restart: unless-stopped
          environment:
            POSTGRES_DB: ${postgres_db}
            POSTGRES_USER: ${postgres_user}
            POSTGRES_PASSWORD: ${postgres_password}
          ports:
            - "${postgres_port}:5432"
          volumes:
            - postgres_data:/var/lib/postgresql/data
            - /opt/ajasta-app/data/postgres:/var/lib/postgresql/data
          networks:
            - ajasta-app-net
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"

        backend:
          image: ${backend_image}
          container_name: ajasta-backend
          restart: unless-stopped
          depends_on:
            postgres:
              condition: service_healthy
          environment:
            # Database Configuration
            DB_URL: jdbc:postgresql://postgres:5432/${postgres_db}
            DB_USERNAME: ${postgres_user}
            DB_PASSWORD: ${postgres_password}

            # Application Configuration
            JWT_SECRET: ${jwt_secret}

            # Optional configurations
            MAIL_USERNAME: ${mail_username}
            MAIL_PASSWORD: ${mail_password}
            AWS_ACCESS_KEY_ID: ${aws_access_key_id}
            AWS_SECRET_ACCESS_KEY: ${aws_secret_access_key}
            AWS_REGION: ${aws_region}
            AWS_S3_BUCKET: ${aws_s3_bucket}
            STRIPE_PUBLIC_KEY: ${stripe_public_key}
            STRIPE_SECRET_KEY: ${stripe_secret_key}

            # JVM Configuration
            JAVA_OPTS: ${java_opts}

            # Production settings
            SPRING_PROFILES_ACTIVE: production
            SERVER_PORT: 8090
          ports:
            - "${backend_port}:8090"
          networks:
            - ajasta-app-net
          volumes:
            - /opt/ajasta-app/logs/backend:/app/logs
            - /opt/ajasta-app/data/backend:/app/data
          healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || curl -f http://localhost:8090/ || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"

        frontend:
          image: ${frontend_image}
          container_name: ajasta-frontend
          restart: unless-stopped
          depends_on:
            backend:
              condition: service_healthy
          ports:
            - "${frontend_port}:80"
          networks:
            - ajasta-app-net
          volumes:
            - /opt/ajasta-app/logs/frontend:/var/log/nginx
          healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"

      volumes:
        postgres_data:
          driver: local

      networks:
        ajasta-app-net:
          driver: bridge
          name: ${app_network_name}

  - path: /opt/ajasta-app/.env
    permissions: '0600'
    content: |
      # Ajasta Application Environment Variables
      # Generated by Terraform

      # Database Configuration
      POSTGRES_DB=${postgres_db}
      POSTGRES_USER=${postgres_user}
      POSTGRES_PASSWORD=${postgres_password}
      POSTGRES_PORT=${postgres_port}

      # Application Ports
      FRONTEND_PORT=${frontend_port}
      BACKEND_PORT=${backend_port}

      # Application Secrets
      JWT_SECRET=${jwt_secret}

      # Optional Service Configurations
      MAIL_USERNAME=${mail_username}
      MAIL_PASSWORD=${mail_password}
      AWS_ACCESS_KEY_ID=${aws_access_key_id}
      AWS_SECRET_ACCESS_KEY=${aws_secret_access_key}
      AWS_REGION=${aws_region}
      AWS_S3_BUCKET=${aws_s3_bucket}
      STRIPE_PUBLIC_KEY=${stripe_public_key}
      STRIPE_SECRET_KEY=${stripe_secret_key}

      # Docker Images
      BACKEND_IMAGE=${backend_image}
      FRONTEND_IMAGE=${frontend_image}

      # JVM Configuration
      JAVA_OPTS=${java_opts}

  - path: /opt/ajasta-app/start-app.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      echo "🚀 Starting Ajasta Application..."

      # Navigate to app directory
      cd /opt/ajasta-app

      # Load environment variables
      if [ -f .env ]; then
          export $(cat .env | grep -v '^#' | xargs)
      fi

      # Stop existing containers if running
      echo "🛑 Stopping existing containers..."
      docker-compose down || true

      # Pull latest images
      echo "📦 Pulling latest images..."
      docker-compose pull

      # Start the application
      echo "🎬 Starting application containers..."
      docker-compose up -d

      # Wait for services to be healthy
      echo "⏳ Waiting for services to start..."
      sleep 30

      # Show status
      echo "📊 Application Status:"
      docker-compose ps

      echo ""
      echo "🌐 Application URLs:"
      PUBLIC_IP=$(curl -s ifconfig.me || echo "localhost")
      echo "   Frontend: http://$PUBLIC_IP:$FRONTEND_PORT/"
      echo "   Backend API: http://$PUBLIC_IP:$BACKEND_PORT/api"

      echo ""
      echo "📋 Container logs:"
      docker-compose logs --tail=10

      echo ""
      echo "✅ Ajasta Application is running!"

  - path: /opt/ajasta-app/stop-app.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      echo "🛑 Stopping Ajasta Application..."

      cd /opt/ajasta-app

      docker-compose down

      echo "✅ Ajasta Application stopped!"

  - path: /opt/ajasta-app/status-app.sh
    permissions: '0755'
    content: |
      #!/bin/bash

      echo "📊 Ajasta Application Status"
      echo "============================"

      cd /opt/ajasta-app

      echo "📋 Docker Containers:"
      docker-compose ps

      echo ""
      echo "📈 Resource Usage:"
      docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.BlockIO}}"

      echo ""
      echo "🏥 Health Checks:"

      # Check PostgreSQL
      if docker-compose exec -T postgres pg_isready -U ${postgres_user} -d ${postgres_db} >/dev/null 2>&1; then
          echo "   ✅ PostgreSQL: Healthy"
      else
          echo "   ❌ PostgreSQL: Not healthy"
      fi

      # Check Backend
      if curl -f http://localhost:${backend_port}/api/health >/dev/null 2>&1 || curl -f http://localhost:${backend_port}/ >/dev/null 2>&1; then
          echo "   ✅ Backend API: Healthy"
      else
          echo "   ❌ Backend API: Not healthy"
      fi

      # Check Frontend
      if curl -f http://localhost:${frontend_port}/ >/dev/null 2>&1; then
          echo "   ✅ Frontend: Healthy"
      else
          echo "   ❌ Frontend: Not healthy"
      fi

      echo ""
      echo "🌐 Public Access:"
      PUBLIC_IP=$(curl -s ifconfig.me || echo "localhost")
      echo "   Frontend: http://$PUBLIC_IP:${frontend_port}/"
      echo "   Backend API: http://$PUBLIC_IP:${backend_port}/api"

# Run commands after cloud-init completes
runcmd:
  - echo "🔧 Starting Ajasta application setup..."
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ajasta
  - sleep 10
  - cd /opt/ajasta-app
  - chmod +x start-app.sh stop-app.sh status-app.sh
  - echo "🚀 Starting Ajasta application..."
  - ./start-app.sh
  - echo "✅ Ajasta application setup completed!"
  - echo "📋 Application status:"
  - ./status-app.sh

# Final message
final_message: |
  🎉 Ajasta Application Deployment Complete!

  The application has been successfully deployed and started.

  To manage the application:
  - Start:   /opt/ajasta-app/start-app.sh
  - Stop:    /opt/ajasta-app/stop-app.sh
  - Status:  /opt/ajasta-app/status-app.sh

  Application logs: docker-compose logs -f
  Configuration: /opt/ajasta-app/.env