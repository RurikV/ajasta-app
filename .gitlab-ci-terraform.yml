---
# GitLab CI/CD Pipeline for Terraform Operations (Shell Runner Compatible)
# This file handles Terraform infrastructure deployment for Kubernetes cluster

variables:
  # Terraform configuration
  TF_ROOT: "${CI_PROJECT_DIR}"
  TF_STATE_NAME: "production"

  # GitLab Terraform HTTP backend configuration
  TF_HTTP_ADDRESS: >
    ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}
  TF_HTTP_LOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_USERNAME: "gitlab-ci-token"
  TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"

  # Terraform CLI cache directories
  TF_PLUGIN_CACHE_DIR: "${CI_PROJECT_DIR}/.terraform.d/plugin-cache"

  # Yandex Cloud variables - use existing CI variables
  TF_VAR_yc_cloud_id: "${YC_CLOUD_ID}"
  TF_VAR_yc_folder_id: "${YC_FOLDER_ID}"
  TF_VAR_yc_token: "${YC_TOKEN}"
  TF_VAR_ssh_username: "ajasta"
  SSH_PRIVATE_KEY: "${YC_SSH_PRIVATE_KEY}"

# Base configuration for Terraform jobs (Shell Runner)
.terraform_base: &terraform_base
  before_script:
    # Create plugin cache directory
    - mkdir -p "${TF_PLUGIN_CACHE_DIR}"

    # Make setup script executable and run it from project root
    - chmod +x scripts/terraform-setup.sh

    # Run external terraform setup script from project root
    - scripts/terraform-setup.sh

    # Setup Terraform CLI config
    - export TF_CLI_CONFIG_FILE="${CI_PROJECT_DIR}/.terraformrc"

    # Create .terraformrc file
    - |
      cat > ${CI_PROJECT_DIR}/.terraformrc << 'EOF'
      provider_installation {
        network_mirror {
          url = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }
        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      EOF

    # Show versions
    - terraform --version
    - jq --version

    # Initialize Terraform
    - terraform init -input=false -backend=true
      -backend-config="address=${TF_HTTP_ADDRESS}"
      -backend-config="lock_address=${TF_HTTP_LOCK_ADDRESS}"
      -backend-config="unlock_address=${TF_HTTP_UNLOCK_ADDRESS}"
      -backend-config="username=${TF_HTTP_USERNAME}"
      -backend-config="password=${TF_HTTP_PASSWORD}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=POST"
      -backend-config="retry_wait_min=5"
  cache:
    key: terraform-${CI_COMMIT_REF_SLUG}
    paths:
      - .terraform/
      - .terraform.lock.hcl

# Terraform validation stage
terraform:validate:
  <<: *terraform_base
  stage: plan
  script:
    - terraform fmt -check -recursive
    - terraform validate -no-color
    - echo "Terraform validation completed successfully"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true  # Don't block pipeline if Terraform validation fails

# Terraform planning stage
terraform:plan:
  <<: *terraform_base
  stage: plan
  script:
    - terraform plan -input=false -out=plan.tfplan
    - terraform show -no-color plan.tfplan > plan.txt
    - echo "Terraform plan created successfully"
    - ls -la plan.tfplan plan.txt
  artifacts:
    paths:
      - plan.tfplan
      - plan.txt
    expire_in: "1 week"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  needs: [terraform:validate]

# Terraform apply job for development (automatic)
terraform:apply:dev:
  <<: *terraform_base
  stage: deploy
  environment:
    name: terraform-dev
  script:
    - terraform apply -input=false -auto-approve plan.tfplan
    - echo "TERRAFORM_MASTER_IP=" > terraform_outputs.env
    - terraform output -raw master_public_ip >> terraform_outputs.env
    - echo "TERRAFORM_WORKER_IPS=" >> terraform_outputs.env
    - terraform output -json worker_public_ips >> terraform_outputs.env
    - echo "TERRAFORM_CLUSTER_READY=true" >> terraform_outputs.env
    - ls -la terraform_outputs.env
  artifacts:
    paths:
      - terraform_outputs.env
    reports:
      dotenv: terraform_outputs.env
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  needs: [terraform:plan]

# Terraform apply job for production (manual deployment)
deploy:tf:production:
  <<: *terraform_base
  stage: deploy
  environment:
    name: terraform-production
    url: http://${TF_VAR_master_public_ip:-$YC_VM_EXTERNAL_IP}
    on_stop: terraform:destroy:production
  script:
    - terraform apply -input=false plan.tfplan
    - echo "TERRAFORM_MASTER_IP=" > terraform_outputs.env
    - terraform output -raw master_public_ip >> terraform_outputs.env
    - echo "TERRAFORM_WORKER_IPS=" >> terraform_outputs.env
    - terraform output -json worker_public_ips >> terraform_outputs.env
    - echo "TERRAFORM_CLUSTER_READY=true" >> terraform_outputs.env
    - echo "Production Kubernetes Cluster Created Successfully"
    - echo "Cluster ready for application deployment"
    - ls -la terraform_outputs.env
  artifacts:
    paths:
      - terraform_outputs.env
    reports:
      dotenv: terraform_outputs.env
    expire_in: "1 month"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs: [terraform:plan]
  timeout: 30m

# Update kubeconfig after Terraform deployment
k8s:update-kubeconfig:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl jq
    - chmod +x ../scripts/update-kubeconfig.sh
  script:
    # Wait a bit for the cluster to be ready
    - echo "⏳ Waiting 60 seconds for Kubernetes cluster to initialize..."
    - sleep 60
    # Run the kubeconfig update script
    - ../scripts/update-kubeconfig.sh "$TERRAFORM_MASTER_IP"
    # Verify the connection
    - export KUBECONFIG="$HOME/.kube/config"
    - kubectl cluster-info
    - kubectl get nodes
    - echo "✅ Kubeconfig updated and verified successfully"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs: [deploy:tf:production]
  dependencies:
    - deploy:tf:production
  timeout: 10m
  environment:
    name: terraform-production
    url: http://${TERRAFORM_MASTER_IP:-$YC_VM_EXTERNAL_IP}

# Terraform destroy job for production (manual cleanup)
terraform:destroy:production:
  <<: *terraform_base
  stage: deploy
  environment:
    name: terraform-production
    action: stop
  script:
    - terraform plan -destroy -out=destroy.tfplan
    - terraform apply -input=false -auto-approve destroy.tfplan
    - echo "Production infrastructure destroyed successfully"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs: []
  timeout: 15m
  allow_failure: true
