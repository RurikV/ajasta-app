---
# GitLab CI/CD Pipeline for Ajasta App
# This is the main pipeline configuration file that includes modular components
# for better maintainability and readability.

# Workflow rules to prevent duplicate pipelines
# Prefer branch pipelines over MR pipelines
# When pushing to main/develop, run the branch pipeline (not the MR pipeline)
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'  # Allow branch pipelines first
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event"
        && $CI_OPEN_MERGE_REQUESTS
      when: never  # Block MR pipeline when branch commit exists

# Include modular CI configuration files from .gitlab-ci directory
include:
  # Global variables (Docker, Terraform, YC, GitLab auth)
  - local: '.gitlab-ci/.gitlab-ci-vars.yml'

  # Terraform jobs (validate, plan, apply, destroy for staging/production)
  - local: '.gitlab-ci/.gitlab-ci-terraform.yml'

  # Docker build jobs (backend/frontend with multi-arch support)
  - local: '.gitlab-ci/.gitlab-ci-docker.yml'

  # Validation jobs (syntax, Dockerfile, Helm lint)
  - local: '.gitlab-ci/.gitlab-ci-validate.yml'

  # Test jobs (backend/frontend tests)
  - local: '.gitlab-ci/.gitlab-ci-test.yml'

  # Package jobs (Docker Compose)
  - local: '.gitlab-ci/.gitlab-ci-package.yml'

  # Deployment jobs (Yandex Cloud VM, Kubernetes with Helm)
  - local: '.gitlab-ci/.gitlab-ci-deploy.yml'

  # Monitoring jobs (Prometheus, Grafana, exporters)
  - local: '.gitlab-ci/.gitlab-ci-monitoring.yml'

# Pipeline stages
stages:
  - validate
  - plan
  - build
  - test
  - package
  - deploy
  - terraform-plan
  - terraform-apply
  - deploy-monitoring
  - verify
  - notify
