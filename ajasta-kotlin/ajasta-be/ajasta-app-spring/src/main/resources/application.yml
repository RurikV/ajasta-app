spring:
  application:
    name: ajasta-app-spring
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/ajasta/protocol/openid-connect/certs}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Keycloak configuration
keycloak:
  realm: ajasta
  resource: ajasta-backend
  auth-server-url: ${KEYCLOAK_AUTH_URL:http://keycloak:8080}
  ssl-required: external
  bearer-only: true
  confidential-port: 0

logging:
  level:
    root: INFO
    top.ajasta: DEBUG
    org.springframework.security: DEBUG
