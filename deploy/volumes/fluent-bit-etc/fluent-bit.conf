# Fluent Bit Configuration for Ajasta App
# Lightweight log collection agent (~30MB RAM)

[SERVICE]
    # Service settings
    Flush           1
    Log_Level       info
    Daemon          off
    Parsers_File    parsers.conf
    HTTP_Server     on
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

    # Buffer settings
    storage.path            /var/log/flb-storage/
    storage.sync            normal
    storage.checksum        off
    storage.backlog.mem_limit 5M

[INPUT]
    # Receive logs from Docker containers via Fluentd forward protocol
    Name                forward
    Listen              0.0.0.0
    Port                24224
    Tag                 app
    Chunk_Size          32KB
    Buffer_Size         64KB

[FILTER]
    # Add container metadata
    Name                record_modifier
    Match               app.*
    Record              hostname ${HOSTNAME}
    Record              environment development

[FILTER]
    # Parse JSON logs
    Name                parser
    Match               app.*
    Key_Name            log
    Parser              json
    Reserve_Data        On
    Preserve_Key        On

[FILTER]
    # Add timestamp if not present
    Name                lua
    Match               app.*
    script              /fluent-bit/etc/timestamp.lua
    call                add_timestamp

[OUTPUT]
    # Send logs to OpenSearch
    Name                opensearch
    Match               app.*
    Host                opensearch
    Port                9200
    TLS                 On
    TLS.Verify          Off
    HTTP_User           admin
    HTTP_Passwd         AjastaAdmin123!
    Index               ajasta-logs
    Type                _doc
    Logstash_Format     On
    Logstash_Prefix     ajasta-app
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Replace_Dots        On
    Retry_Limit         False
    Buffer_Size         5MB

[OUTPUT]
    # Debug output to stdout (optional - remove in production)
    Name                stdout
    Match               *
