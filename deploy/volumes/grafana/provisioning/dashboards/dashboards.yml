# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'Ajasta Dashboards'
    orgId: 1
    folder: 'Ajasta'
    folderUid: 'ajasta-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
