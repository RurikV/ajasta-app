# Staging Environment Configuration
# This file contains all environment-specific settings for staging

environment:
  name: staging
  display_name: "Staging Environment"

# Application domains
domains:
  frontend: staging.ajasta.top
  backend: staging.ajasta.top
  api_path: /api

# Infrastructure configuration
infrastructure:
  # VM naming pattern (matches Terraform prefix)
  vm_prefix: "ajasta-staging"

  # Resource limits
  master_memory: 6
  master_cores: 2
  worker_memory: 6
  worker_cores: 2
  worker_count: 1

# Kubernetes configuration
kubernetes:
  cluster_name: ajasta-staging-cluster

# Application configuration
application:
  # Backend
  backend:
    image: vladimirryrik/ajasta-backend
    tag: alpine
    replicas: 1
    resources:
      cpu:
        request: 250m
        limit: 500m
      memory:
        request: 256Mi
        limit: 512Mi
      ephemeral_storage:
        request: 1Gi
        limit: 2Gi

  # Frontend
  frontend:
    image: vladimirryrik/ajasta-frontend
    tag: alpine
    replicas: 1
    resources:
      cpu:
        request: 100m
        limit: 200m
      memory:
        request: 64Mi
        limit: 128Mi
      ephemeral_storage:
        request: 500Mi
        limit: 1Gi

  # PostgreSQL (CloudNativePG)
  postgresql:
    cluster_name: cluster-postgresql-staging
    namespace: postgresql-cluster
    instances: 1
    storage:
      size: 5Gi
      storage_class: longhorn
    resources:
      cpu:
        request: 250m
        limit: 500m
      memory:
        request: 256Mi
        limit: 512Mi

# Ingress configuration
ingress:
  class_name: nginx
  tls_enabled: true
  cert_manager_enabled: true
  letsencrypt:
    email: admin@ajasta.top
    # Use staging issuer for testing
    issuer: letsencrypt-staging

# Monitoring and logging
monitoring:
  enabled: true
  namespace: monitoring

# Security settings
security:
  # JWT secret (CHANGE IN PRODUCTION!)
  jwt_secret: staging-jwt-secret-change-me-2024

  # Database passwords (autogenerated by CloudNativePG)
  db_password_autogenerated: true

# Feature flags
features:
  backups: false
  autoscaling: false
  monitoring_stack: false
