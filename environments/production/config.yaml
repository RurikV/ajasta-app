# Production Environment Configuration
# This file contains all environment-specific settings for production

environment:
  name: production
  display_name: "Production Environment"

# Application domains
domains:
  frontend: ajasta.top
  backend: ajasta.top
  api_path: /api

# Infrastructure configuration
infrastructure:
  # VM naming pattern (matches Terraform prefix)
  vm_prefix: "ajasta-prod"

  # Resource limits
  master_memory: 8
  master_cores: 4
  worker_memory: 8
  worker_cores: 4
  worker_count: 3

# Kubernetes configuration
kubernetes:
  cluster_name: ajasta-production-cluster

# Application configuration
application:
  # Backend
  backend:
    image: vladimirryrik/ajasta-backend
    tag: alpine
    replicas: 2
    resources:
      cpu:
        request: 500m
        limit: 1000m
      memory:
        request: 512Mi
        limit: 1Gi
      ephemeral_storage:
        request: 2Gi
        limit: 4Gi

  # Frontend
  frontend:
    image: vladimirryrik/ajasta-frontend
    tag: alpine
    replicas: 2
    resources:
      cpu:
        request: 100m
        limit: 200m
      memory:
        request: 64Mi
        limit: 128Mi
      ephemeral_storage:
        request: 500Mi
        limit: 1Gi

  # PostgreSQL (CloudNativePG)
  postgresql:
    cluster_name: cluster-postgresql-production
    namespace: postgresql-cluster
    instances: 2  # HA with 1 replica
    storage:
      size: 20Gi
      storage_class: longhorn
    resources:
      cpu:
        request: 500m
        limit: 1000m
      memory:
        request: 512Mi
        limit: 1Gi

# Ingress configuration
ingress:
  class_name: nginx
  tls_enabled: true
  cert_manager_enabled: true
  letsencrypt:
    email: admin@ajasta.top
    # Use production issuer
    issuer: letsencrypt-production

# Monitoring and logging
monitoring:
  enabled: true
  namespace: monitoring

# Security settings
security:
  # JWT secret (MUST BE CHANGED IN PRODUCTION!)
  jwt_secret: CHANGE-ME-PRODUCTION-SECRET-KEY-GENERATE-STRONG-ONE

  # Database passwords (autogenerated by CloudNativePG)
  db_password_autogenerated: true

# Feature flags
features:
  backups: true
  autoscaling: true
  monitoring_stack: true
