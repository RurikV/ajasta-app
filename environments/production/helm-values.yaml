# Production Environment Helm Values
# Environment: production
# Domain: ajasta.top

# Global settings
global:
  namespace: ajasta
  environment: production

# Namespace configuration
namespace:
  create: true
  name: ajasta
  labels:
    name: ajasta
    app: ajasta
    environment: production

# PostgreSQL Database configuration
postgres:
  enabled: false  # Using CloudNativePG instead
  # Note: PostgreSQL is deployed via CloudNativePG operator
  # See ansible playbook: 21-deploy-postgres-cluster.yml

# Backend API configuration
backend:
  enabled: true
  image:
    repository: vladimirryrik/ajasta-backend
    tag: alpine
    pullPolicy: IfNotPresent

  replicas: 2

  service:
    name: ajasta-backend
    port: 8090
    targetPort: 8090
    type: ClusterIP

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
      ephemeral-storage: "2Gi"
    limits:
      memory: "1Gi"
      cpu: "1000m"
      ephemeral-storage: "4Gi"

  # Database connection configuration (CloudNativePG)
  database:
    url: jdbc:postgresql://cluster-postgresql-production-rw.postgresql-cluster:5432/ajastadb
    username: ajasta
    password: autogenerated-by-cnpg

  # Application secrets (MUST BE CHANGED IN PRODUCTION!)
  secrets:
    jwtSecret: CHANGE-ME-PRODUCTION-SECRET-KEY-GENERATE-STRONG-ONE
    mailUsername: ""
    mailPassword: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
    stripePublicKey: ""
    stripeSecretKey: ""

  # Application configuration
  config:
    awsRegion: us-east-1
    awsS3Bucket: ""
    javaOpts: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  livenessProbe:
    tcpSocket:
      port: 8090
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: 8090
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  # Node affinity to avoid control-plane nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist

# Frontend configuration
frontend:
  enabled: true
  image:
    repository: vladimirryrik/ajasta-frontend
    tag: alpine
    pullPolicy: IfNotPresent

  replicas: 2

  service:
    name: ajasta-frontend
    port: 80
    targetPort: 80
    type: ClusterIP

  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
      ephemeral-storage: "500Mi"
    limits:
      memory: "128Mi"
      cpu: "200m"
      ephemeral-storage: "1Gi"

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Node affinity to avoid control-plane nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  defaultBackend:
    enabled: false
    serviceName: ajasta-frontend
    servicePort: 80
  hosts:
    - host: ajasta.top
      paths:
        - path: /
          pathType: Prefix
          serviceName: ajasta-frontend
          servicePort: 80
        - path: /api
          pathType: Prefix
          serviceName: ajasta-backend
          servicePort: 8090
  tls:
    - secretName: ajasta-production-tls
      hosts:
        - ajasta.top

# RBAC configuration
rbac:
  create: true
  serviceAccount:
    create: true
    name: ajasta-sa
    annotations: {}
