      fi

    # Create destroy plan with locking disabled to prevent lock acquisition failures
    - terraform plan -destroy -out=destroy.tfplan -input=false -lock=false
    - |
      if [ -f destroy.tfplan ]; then
        echo "✅ Destroy plan created successfully"
      else
        echo "❌ Destroy plan file not created"
        exit 1
      fi

    # Show destroy plan
    - terraform show -no-color destroy.tfplan

    # Apply destroy with locking disabled to prevent lock acquisition failures
    - terraform apply -input=false -auto-approve -lock=false destroy.tfplan
    - |
      # After destroy, resources should be gone (no outputs expected)

      # Check if state upload failed and errored.tfstate exists
      if [ -f "errored.tfstate" ]; then
        echo "⚠️  State upload failed during destroy, attempting to push errored state..."
        if terraform state push errored.tfstate; then
          echo "✅ State pushed successfully"
          rm -f errored.tfstate
        else
          echo "❌ Failed to push state - resources destroyed but state not updated"
          # Don't fail the job since destroy already succeeded
        fi
      fi
      echo "✅ Destroy completed successfully"

    - echo "Production infrastructure destroyed successfully"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  environment:
    name: production
    action: stop
  needs: []
  timeout: 15m
