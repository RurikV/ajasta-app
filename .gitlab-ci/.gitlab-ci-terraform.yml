---
# Terraform CI/CD Jobs
# This file contains all Terraform-related jobs for infrastructure provisioning

# Base template for all Terraform jobs
.terraform_base:
  before_script:
    # Create plugin cache directory
    - mkdir -p "${CI_PROJECT_DIR}/.terraform.d/plugin-cache"

    # Setup Terraform CLI config for Yandex Cloud mirror
    - export TF_CLI_CONFIG_FILE="${CI_PROJECT_DIR}/.terraformrc"
    - echo 'provider_installation {' > ${CI_PROJECT_DIR}/.terraformrc
    - echo '  network_mirror {' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '    url = "https://terraform-mirror.yandexcloud.net/"' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '    include = ["registry.terraform.io/*/*"]' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '  }' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '  direct {' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '    exclude = ["registry.terraform.io/*/*"]' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '  }' >> ${CI_PROJECT_DIR}/.terraformrc
    - echo '}' >> ${CI_PROJECT_DIR}/.terraformrc

    # Navigate to terraform directory
    - cd ${TF_ROOT}

    # Clean up ALL local state and cache to ensure fresh start
    - echo "CLEANING Cleaning up local Terraform state and cache..."
    - rm -rf .terraform || true
    - rm -f .terraform.lock.hcl || true
    - rm -f terraform.tfstate* || true
    - rm -f *.tfstate || true
    - rm -f errored.tfstate || true
    - rm -f .terraform/environment || true
    - find . -name "*.tfstate*" -type f -delete 2>/dev/null || true
    - find . -name ".terraform" -type d -exec rm -rf {} + 2>/dev/null || true
    - echo "OK Cleanup complete"

    # Show versions
    - terraform --version

# Terraform format and validation - runs on all branches
terraform:fmt:
  stage: validate
  extends: .terraform_base
  script:
    - terraform fmt -check -recursive || (terraform fmt -recursive -write=true && exit 1)
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false

# Terraform validate
terraform:validate:
  stage: validate
  extends: .terraform_base
  script:
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs: [terraform:fmt]

# Security scan with tfsec
terraform:security-scan:
  stage: validate
  extends: .terraform_base
  script:
    - terraform init -backend=false
    - |
      # Install tfsec if not present
      if ! command -v tfsec >/dev/null 2>&1; then
        curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o /tmp/tfsec
        chmod +x /tmp/tfsec
        export PATH=/tmp:$PATH
      fi
    - tfsec --format json --out tfsec-report.json . || true
    - tfsec --format text . || true
  artifacts:
    reports:
      sast: tfsec-report.json
    paths:
      - terraform/tfsec-report.json
    expire_in: "1 week"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true
  needs: [terraform:validate]

# Plan for staging environment (available on develop and main branches)
terraform:plan:staging:
  stage: plan
  extends: .terraform_base
  variables:
    TF_STATE_NAME: "staging"
  script:
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging"
    - export TF_HTTP_LOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging/lock"
    - if [ -n "${GITLAB_PAT}" ] && [ -n "${GITLAB_USERNAME}" ]; then export TF_HTTP_USERNAME="${GITLAB_USERNAME}"; export TF_HTTP_PASSWORD="${GITLAB_PAT}"; export TF_PASSWORD="${GITLAB_PAT}"; else export TF_HTTP_USERNAME="gitlab-ci-token"; export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"; export TF_PASSWORD="${CI_JOB_TOKEN}"; fi
    - terraform init -backend=true -backend-config="address=${TF_HTTP_ADDRESS}" -backend-config="lock_address=${TF_HTTP_LOCK_ADDRESS}" -backend-config="unlock_address=${TF_HTTP_UNLOCK_ADDRESS}" -backend-config="username=${TF_HTTP_USERNAME}" -backend-config="password=${TF_HTTP_PASSWORD}" -backend-config="lock_method=POST" -backend-config="unlock_method=POST" -backend-config="retry_wait_min=5" -backend-config="retry_wait_max=30"
    - if [ $? -ne 0 ]; then exit 1; fi
    - if [ -f "staging.tfvars" ]; then cp staging.tfvars terraform.tfvars; fi
    - terraform plan -out=plan.tfplan -input=false -lock=false
    - if [ $? -ne 0 ]; then exit 1; fi
    - if [ ! -f plan.tfplan ]; then exit 1; fi
    - terraform show -no-color plan.tfplan > plan.txt
    - if [ $? -ne 0 ]; then exit 1; fi

  artifacts:
    paths:
      - terraform/plan.tfplan
      - terraform/plan.txt
    expire_in: "1 week"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: staging
    action: prepare

# Plan for production environment (manual on main branch)
terraform:plan:production:
  stage: plan
  extends: .terraform_base
  variables:
    TF_STATE_NAME: "production"
  script:
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production"
    - export TF_HTTP_LOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production/lock"
    - if [ -n "${GITLAB_PAT}" ] && [ -n "${GITLAB_USERNAME}" ]; then export TF_HTTP_USERNAME="${GITLAB_USERNAME}"; export TF_HTTP_PASSWORD="${GITLAB_PAT}"; export TF_PASSWORD="${GITLAB_PAT}"; else export TF_HTTP_USERNAME="gitlab-ci-token"; export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"; export TF_PASSWORD="${CI_JOB_TOKEN}"; fi
    - terraform init -backend=true -backend-config="address=${TF_HTTP_ADDRESS}" -backend-config="lock_address=${TF_HTTP_LOCK_ADDRESS}" -backend-config="unlock_address=${TF_HTTP_UNLOCK_ADDRESS}" -backend-config="username=${TF_HTTP_USERNAME}" -backend-config="password=${TF_HTTP_PASSWORD}" -backend-config="lock_method=POST" -backend-config="unlock_method=POST" -backend-config="retry_wait_min=5" -backend-config="retry_wait_max=30"
    - if [ $? -ne 0 ]; then exit 1; fi
    - if [ -f "production.tfvars" ]; then cp production.tfvars terraform.tfvars; fi
    - terraform plan -out=plan.tfplan -input=false -lock=false
    - if [ $? -ne 0 ]; then exit 1; fi
    - if [ ! -f plan.tfplan ]; then exit 1; fi
    - terraform show -no-color plan.tfplan > plan.txt
    - if [ $? -ne 0 ]; then exit 1; fi
    - cat plan.txt
  artifacts:
    paths:
      - terraform/plan.tfplan
      - terraform/plan.txt
    expire_in: "1 month"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    action: prepare

# Apply to staging (manual on both develop and main branches)
terraform:apply:staging:
  stage: deploy
  extends: .terraform_base
  variables:
    TF_STATE_NAME: "staging"
  script:
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging"
    - export TF_HTTP_LOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging/lock"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - export TF_PASSWORD="${CI_JOB_TOKEN}"
    - terraform init -backend=true -backend-config="address=${TF_HTTP_ADDRESS}" -backend-config="lock_address=${TF_HTTP_LOCK_ADDRESS}" -backend-config="unlock_address=${TF_HTTP_UNLOCK_ADDRESS}" -backend-config="username=${TF_HTTP_USERNAME}" -backend-config="password=${TF_HTTP_PASSWORD}" -backend-config="lock_method=POST" -backend-config="unlock_method=POST" -backend-config="retry_wait_min=5" -backend-config="retry_wait_max=30"
    - cp staging.tfvars terraform.tfvars || true
    - terraform apply -input=false -auto-approve -lock=false plan.tfplan
    - terraform output -json > outputs.json || true
  artifacts:
    paths:
      - terraform/outputs.json
    reports:
      dotenv: terraform/terraform-outputs.env
    expire_in: "1 week"
  rules:
    # Available on develop branch (manual)
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: false
    # Available on main branch (manual for testing)
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  environment:
    name: staging
    url: http://${TF_VAR_master_public_ip:-$YC_VM_EXTERNAL_IP}
    on_stop: terraform:destroy:staging
  needs: [terraform:plan:staging]
  allow_failure: false

# Apply to production (manual on main branch)
terraform:apply:production:
  stage: deploy
  extends: .terraform_base
  variables:
    TF_STATE_NAME: "production"
  script:
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production"
    - export TF_HTTP_LOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production/lock"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - export TF_PASSWORD="${CI_JOB_TOKEN}"
    - terraform init -backend=true -backend-config="address=${TF_HTTP_ADDRESS}" -backend-config="lock_address=${TF_HTTP_LOCK_ADDRESS}" -backend-config="unlock_address=${TF_HTTP_UNLOCK_ADDRESS}" -backend-config="username=${TF_HTTP_USERNAME}" -backend-config="password=${TF_HTTP_PASSWORD}" -backend-config="lock_method=POST" -backend-config="unlock_method=POST" -backend-config="retry_wait_min=5" -backend-config="retry_wait_max=30"
    - cp production.tfvars terraform.tfvars || true
    - terraform apply -input=false -auto-approve -lock=false plan.tfplan
    - terraform output -json > outputs.json || true
  artifacts:
    paths:
      - terraform/outputs.json
      - terraform/terraform-outputs.env
    reports:
      dotenv: terraform/terraform-outputs.env
    expire_in: "1 month"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual  # Manual approval required for production
  environment:
    name: production
    url: http://${TF_VAR_master_public_ip:-$YC_VM_EXTERNAL_IP}
    on_stop: terraform:destroy:production
  needs: [terraform:plan:production]
  timeout: 30m

# Update kubeconfig after Terraform deployment
k8s:update-kubeconfig:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl jq bash
  script:
    # Extract master IP from terraform outputs
    - |
      if [ -f "terraform/terraform-outputs.env" ]; then
        source terraform/terraform-outputs.env
        MASTER_IP="${TERRAFORM_MASTER_IP:-$TERRAFORM_MASTER_PUBLIC_IP}"
      else
        # Fallback to manual IP specification
        MASTER_IP="${TERRAFORM_MASTER_IP:-$YC_VM_EXTERNAL_IP}"
      fi

      if [ -z "$MASTER_IP" ]; then
        echo "ERROR: Unable to determine master IP"
        echo "TERRAFORM_MASTER_IP not set and terraform-outputs.env not found"
        exit 1
      fi

      echo "Master IP: $MASTER_IP"

    # Setup SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      cat > ~/.ssh/config <<EOF
      Host *
          StrictHostKeyChecking no
          UserKnownHostsFile=/dev/null
      EOF
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

    # Wait for cluster to be ready
    - echo "WAITING Waiting 60 seconds for Kubernetes cluster to initialize..."
    - sleep 60

    # Run the kubeconfig update script
    - chmod +x ../scripts/update-kubeconfig.sh
    - ../scripts/update-kubeconfig.sh "$MASTER_IP"

    # Save kubeconfig for downstream jobs
    - mkdir -p ../.kube
    - cp ~/.kube/config ../.kube/config

    # Verify the connection
    - export KUBECONFIG="$PWD/../.kube/config"
    - kubectl cluster-info
    - kubectl get nodes
    - echo "OK Kubeconfig updated and verified successfully"
  artifacts:
    paths:
      - .kube/config
    expire_in: "1 day"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  needs:
    - job: terraform:apply:production
      optional: true
    - job: terraform:apply:staging
      optional: true
  dependencies:
    - terraform:apply:production
    - terraform:apply:staging
  timeout: 15m

# Destroy staging resources (manual)
terraform:destroy:staging:
  stage: deploy
  extends: .terraform_base
  variables:
    TF_STATE_NAME: "staging"
  script:
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging"
    - export TF_HTTP_LOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/staging/lock"
    - |
      # Configure authentication based on available credentials
      if [ -n "${GITLAB_PAT}" ] && [ -n "${GITLAB_USERNAME}" ]; then
        # Use Personal Access Token with actual username (required for PAT auth)
        export TF_HTTP_USERNAME="${GITLAB_USERNAME}"
        export TF_HTTP_PASSWORD="${GITLAB_PAT}"
        export TF_PASSWORD="${GITLAB_PAT}"
        echo "OK Using Personal Access Token (${GITLAB_USERNAME}) for state backend"
      elif [ -n "${GITLAB_PAT}" ]; then
        # PAT provided but no username - try with gitlab-ci-token (may fail)
        export TF_HTTP_USERNAME="gitlab-ci-token"
        export TF_HTTP_PASSWORD="${GITLAB_PAT}"
        export TF_PASSWORD="${GITLAB_PAT}"
        echo "WARNING  Using PAT with gitlab-ci-token username (may not work)"
      else
        # Fallback to CI_JOB_TOKEN (won't work across jobs)
        export TF_HTTP_USERNAME="gitlab-ci-token"
        export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
        export TF_PASSWORD="${CI_JOB_TOKEN}"
        echo "WARNING  Using CI_JOB_TOKEN (will fail across jobs)"
      fi
    - |
      terraform init -backend=true \
        -backend-config="address=${TF_HTTP_ADDRESS}" \
        -backend-config="lock_address=${TF_HTTP_LOCK_ADDRESS}" \
        -backend-config="unlock_address=${TF_HTTP_UNLOCK_ADDRESS}" \
        -backend-config="username=${TF_HTTP_USERNAME}" \
        -backend-config="password=${TF_HTTP_PASSWORD}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=POST" \
        -backend-config="retry_wait_min=5" \
        -backend-config="retry_wait_max=30"

    # Load staging variables
    - |
      if [ -f "staging.tfvars" ]; then
        cp staging.tfvars terraform.tfvars
      fi

    # Create destroy plan with locking disabled to prevent lock acquisition failures
    - terraform plan -destroy -out=destroy.tfplan -input=false -lock=false
    - |
      if [ -f destroy.tfplan ]; then
        echo "OK Destroy plan created successfully"
      else
        echo "ERROR Destroy plan file not created"
        exit 1
      fi

    # Show destroy plan
    - terraform show -no-color destroy.tfplan

    # Apply destroy with locking disabled to prevent lock acquisition failures
    # Use || true to allow error handling for state upload failures
    - terraform apply -input=false -auto-approve -lock=false destroy.tfplan || DESTROY_APPLY_FAILED=true
    - |
      # After destroy, resources should be gone (no outputs expected)

      # Check if state upload failed and errored.tfstate exists
      if [ -f "errored.tfstate" ]; then
        echo "WARNING  State upload failed during destroy, attempting to push errored state..."
        if terraform state push -lock=false errored.tfstate; then
          echo "OK State pushed successfully"
          rm -f errored.tfstate
          unset DESTROY_APPLY_FAILED
        else
          echo "ERROR Failed to push state - resources destroyed but state not updated"
          echo "WARNING  This is non-critical - resources are already destroyed"
          unset DESTROY_APPLY_FAILED
        fi
      fi

      # Only fail if destroy itself failed (not just state upload)
      if [ "${DESTROY_APPLY_FAILED:-false}" = "true" ]; then
        echo "ERROR Destroy apply failed - resources may not have been destroyed"
        exit 1
      fi
      echo "OK Destroy completed successfully"

    - echo "Staging infrastructure destroyed successfully"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
  environment:
    name: staging
    action: stop
  needs: []
  timeout: 15m

