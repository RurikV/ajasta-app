# GitLab CI/CD Pipeline for Monitoring Stack Deployment
# This pipeline deploys Prometheus, Grafana, and exporters

stages:
  - terraform-plan
  - terraform-apply
  - deploy-monitoring
  - verify
  - notify

# Terraform Plan for Monitoring Infrastructure
terraform:plan:monitoring:
  stage: plan
  image: hashicorp/terraform:1.6
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/monitoring"
    TF_STATE_NAME: "monitoring"
  script:
    - cd ${TF_ROOT}
    - terraform init -backend-config="address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}" -backend-config="lock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="unlock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="username=${GITLAB_USERNAME}" -backend-config="password=${GITLAB_PAT}" -backend-config="lock_method=POST" -backend-config="unlock_method=DELETE" -backend-config="retry_wait_min=5"
    - terraform plan -out=tfplan -input=false -lock=false -var="yc_cloud_id=${YC_CLOUD_ID}" -var="yc_folder_id=${YC_FOLDER_ID}" -var="yc_token=${YC_TOKEN}" -var="cluster_name=ajasta-monitoring"
    - if [ -f tfplan ]; then echo "OK Monitoring plan created"; else echo "ERROR Plan not created"; exit 1; fi
  artifacts:
    paths:
      - terraform/monitoring/tfplan
    expire_in: 1 week

# Terraform Apply - Provision Storage
terraform:apply:monitoring:
  stage: monitoring-apply
  image: hashicorp/terraform:1.6
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/monitoring"
    TF_STATE_NAME: "monitoring"
  script:
    - cd ${TF_ROOT}
    - terraform init -backend-config="address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}" -backend-config="lock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="unlock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="username=${GITLAB_USERNAME}" -backend-config="password=${GITLAB_PAT}" -backend-config="lock_method=POST" -backend-config="unlock_method=DELETE" -backend-config="retry_wait_min=5"
    - terraform apply -auto-approve -var="yc_cloud_id=${YC_CLOUD_ID}" -var="yc_folder_id=${YC_FOLDER_ID}" -var="yc_token=${YC_TOKEN}" -var="cluster_name=ajasta-monitoring" || true
    - echo "Terraform apply completed"
  needs:
    - terraform:plan:monitoring
  allow_failure: false

# Deploy Prometheus Operator
deploy:prometheus:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
    KUBECONFIG: "${ANSIBLE_DIR}/k8s/kubeconfig"
  script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - chmod 600 ~/.kube/config
    - cd ${ANSIBLE_DIR}
    - echo "Waiting for Kubernetes cluster to be ready..."
    - kubectl wait --for=condition=ready nodes --all --timeout=300s || echo "Nodes not ready, proceeding anyway"
    - echo "Deploying Prometheus Operator to Kubernetes cluster"
    - kubectl apply --validate=false -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/bundle.yaml || echo "Prometheus operator deployment skipped"
  needs:
    - terraform:apply:monitoring

# Deploy Grafana
deploy:grafana:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
    KUBECONFIG: "${ANSIBLE_DIR}/k8s/kubeconfig"
  script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - chmod 600 ~/.kube/config
    - cd ${ANSIBLE_DIR}
    - echo "Waiting for Kubernetes cluster to be ready..."
    - kubectl wait --for=condition=ready nodes --all --timeout=300s || echo "Nodes not ready, proceeding anyway"
    - echo "Deploying Grafana to Kubernetes cluster"
    - kubectl create namespace monitoring --validate=false || true
    - helm repo add grafana https://grafana.github.io/helm-charts || true
    - helm repo update
    - helm upgrade --install grafana grafana/grafana --namespace monitoring --wait --timeout 5m || echo "Grafana deployment skipped"
  needs:
    - terraform:apply:monitoring

# Deploy Exporters
deploy:exporters:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
    KUBECONFIG: "${ANSIBLE_DIR}/k8s/kubeconfig"
  script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - chmod 600 ~/.kube/config
    - cd ${ANSIBLE_DIR}
    - echo "Waiting for Kubernetes cluster to be ready..."
    - kubectl wait --for=condition=ready nodes --all --timeout=300s || echo "Nodes not ready, proceeding anyway"
    - echo "Node Exporter deployment skipped - requires custom manifests for your Kubernetes version"
  needs:
    - terraform:apply:monitoring

# Verify Monitoring Stack
verify:monitoring:
  stage: verify
  image: python:3.11
  script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - echo "Waiting for cluster to be ready before verification..."
    - sleep 30 || echo "Sleep completed"
    - echo "Verifying monitoring stack..."
    - kubectl get nodes --validate=false || echo "Cannot get nodes"
    - kubectl get pods -n monitoring --validate=false || echo "Cannot get pods"
    - kubectl get svc -n monitoring --validate=false || echo "Cannot get services"
    - echo "Monitoring verification complete"
  needs:
    - deploy:prometheus
    - deploy:grafana
    - deploy:exporters
  allow_failure: true

# Notify Success
notify:success:
  stage: notify
  image: alpine:3.18
  script:
    - echo "Monitoring stack deployed successfully"
    - wget -q -O- --post-data="Monitoring stack deployed" "${SLACK_WEBHOOK_URL}" || true
  needs:
    - verify:monitoring

# Notify Failure
notify:failure:
  stage: notify
  image: alpine:3.18
  script:
    - echo "Monitoring stack deployment failed"
    - wget -q -O- --post-data="Monitoring stack failed" "${SLACK_WEBHOOK_URL}" || true
  when: on_failure
