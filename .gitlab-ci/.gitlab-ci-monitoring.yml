# GitLab CI/CD Pipeline for Monitoring Stack Deployment
# This pipeline deploys Prometheus, Grafana, and exporters

stages:
  - terraform-plan
  - terraform-apply
  - deploy-monitoring
  - verify
  - notify

# Terraform Plan for Monitoring Infrastructure
terraform:plan:monitoring:
  stage: plan
  image: hashicorp/terraform:1.6
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/monitoring"
    TF_STATE_NAME: "monitoring"
  script:
    - cd ${TF_ROOT}
    - terraform init -backend-config="address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}" -backend-config="lock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="unlock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="username=${GITLAB_USERNAME}" -backend-config="password=${GITLAB_PAT}" -backend-config="lock_method=POST" -backend-config="unlock_method=DELETE" -backend-config="retry_wait_min=5"
    - terraform plan -out=tfplan -input=false -lock=false -var="yc_cloud_id=${YC_CLOUD_ID}" -var="yc_folder_id=${YC_FOLDER_ID}" -var="yc_token=${YC_TOKEN}" -var="cluster_name=ajasta-monitoring"
    - if [ -f tfplan ]; then echo "OK Monitoring plan created"; else echo "ERROR Plan not created"; exit 1; fi
  artifacts:
    paths:
      - terraform/monitoring/tfplan
    expire_in: 1 week
  when: manual

# Terraform Apply - Provision Storage
terraform:apply:monitoring:
  stage: monitoring-apply
  image: hashicorp/terraform:1.6
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/monitoring"
    TF_STATE_NAME: "monitoring"
  script:
    - cd ${TF_ROOT}
    - terraform init -backend-config="address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}" -backend-config="lock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="unlock_address=${GITLAB_HTTP_ADDRESS}/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock" -backend-config="username=${GITLAB_USERNAME}" -backend-config="password=${GITLAB_PAT}" -backend-config="lock_method=POST" -backend-config="unlock_method=DELETE" -backend-config="retry_wait_min=5"
    - terraform apply -lock=false -auto-approve -var="yc_cloud_id=${YC_CLOUD_ID}" -var="yc_folder_id=${YC_FOLDER_ID}" -var="yc_token=${YC_TOKEN}" -var="cluster_name=ajasta-monitoring" || true
    - echo "Terraform apply completed"
  needs:
    - terraform:plan:monitoring
  allow_failure: false
  when: manual

# Deploy Prometheus Operator
deploy:prometheus:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
    KUBECONFIG: "${ANSIBLE_DIR}/k8s/kubeconfig"
  script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - chmod 600 ~/.kube/config
    - cd ${ANSIBLE_DIR}
    - echo "Testing Kubernetes cluster connectivity..."
    - if kubectl get nodes --request-timeout=10s > /dev/null 2>&1; then echo "Cluster is reachable, deploying Prometheus..."; kubectl apply --validate=false -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/bundle.yaml && echo "✓ Prometheus deployed" || echo "✗ Prometheus deployment failed"; else echo "⚠ Cluster unreachable - skipping deployment (monitoring infrastructure may not be provisioned yet)"; fi
  needs:
    - terraform:apply:monitoring
  allow_failure: true
  when: manual

# Deploy Grafana
deploy:grafana:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
    KUBECONFIG: "${ANSIBLE_DIR}/k8s/kubeconfig"
  script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - chmod 600 ~/.kube/config
    - cd ${ANSIBLE_DIR}
    - echo "Testing Kubernetes cluster connectivity..."
    - if kubectl get nodes --request-timeout=10s > /dev/null 2>&1; then echo "Cluster is reachable, deploying Grafana..."; kubectl create namespace monitoring --validate=false 2>/dev/null || true; helm repo add grafana https://grafana.github.io/helm-charts 2>/dev/null || true; helm repo update 2>/dev/null || true; helm upgrade --install grafana grafana/grafana --namespace monitoring --wait --timeout 5m && echo "✓ Grafana deployed" || echo "✗ Grafana deployment failed"; else echo "⚠ Cluster unreachable - skipping deployment (monitoring infrastructure may not be provisioned yet)"; fi
  needs:
    - terraform:apply:monitoring
  allow_failure: true
  when: manual

# Deploy Loki for Log Aggregation
deploy:loki:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
  script:
    - pip install ansible-core
    - mkdir -p ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $(grep 'ansible_host=' ${ANSIBLE_INVENTORY} 2>/dev/null | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2 || echo "127.0.0.1") >> ~/.ssh/known_hosts 2>/dev/null || true
    - cd ${ANSIBLE_DIR}/k8s
    - ansible-playbook -i inventory.ini 23-deploy-loki-kubectl.yml --skip-tags confirm || true
    - echo "✓ Loki deployment completed"
  needs:
    - terraform:apply:monitoring
  allow_failure: true
  when: manual

# Deploy Promtail for Log Collection
deploy:promtail:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
  script:
    - pip install ansible-core
    - mkdir -p ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $(grep 'ansible_host=' ${ANSIBLE_INVENTORY} 2>/dev/null | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2 || echo "127.0.0.1") >> ~/.ssh/known_hosts 2>/dev/null || true
    - cd ${ANSIBLE_DIR}/k8s
    - ansible-playbook -i inventory.ini 24-deploy-promtail-kubectl.yml --skip-tags confirm || true
    - echo "✓ Promtail deployment completed"
  needs:
    - deploy:loki
  allow_failure: true
  when: manual

# Deploy Exporters (node_exporter, cadvisor, etc.) and Configure Grafana
deploy:exporters:
  stage: monitoring-deploy
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
  script:
    - pip install ansible-core
    - mkdir -p ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $(grep 'ansible_host=' ${ANSIBLE_INVENTORY} 2>/dev/null | grep 'master-node' | awk '{print $2}' | cut -d'=' -f2 || echo "127.0.0.1") >> ~/.ssh/known_hosts 2>/dev/null || true
    - cd ${ANSIBLE_DIR}/k8s
    - ansible-playbook -i inventory.ini 25-configure-grafana-loki.yml --skip-tags confirm || true
    - echo "✓ cAdvisor deployment completed"
    - echo "✓ Grafana Loki datasource configured"
  needs:
    - deploy:promtail
  allow_failure: true
  when: manual

# Verify Monitoring Stack
verify:monitoring:
  stage: verify
  image: python:3.11
  variables:
    ANSIBLE_DIR: "${CI_PROJECT_DIR}/ansible"
    ANSIBLE_INVENTORY: "${ANSIBLE_DIR}/k8s/inventory.ini"
  script:
    - pip install ansible-core
    - mkdir -p ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - cd ${ANSIBLE_DIR}/k8s
    - echo "Verifying monitoring stack..."
    - |
      # Verify Loki
      echo "=== Verifying Loki ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl get pods -n monitoring -l app=loki" -b | grep -q "Running" && echo "✓ Loki is running" || echo "✗ Loki is not running"

      # Verify Promtail
      echo "=== Verifying Promtail ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl get pods -n monitoring -l app=promtail" -b | grep -q "Running" && echo "✓ Promtail is running" || echo "✗ Promtail is not running"

      # Verify node_exporter
      echo "=== Verifying node_exporter ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl get pods -n monitoring -l app=node-exporter" -b | grep -q "Running" && echo "✓ node_exporter is running" || echo "✗ node_exporter is not running"

      # Verify cAdvisor
      echo "=== Verifying cAdvisor ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl get pods -n monitoring -l app=cadvisor" -b | grep -q "Running" && echo "✓ cAdvisor is running" || echo "✗ cAdvisor is not running"

      # Verify Grafana
      echo "=== Verifying Grafana ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana" -b | grep -q "Running" && echo "✓ Grafana is running" || echo "✗ Grafana is not running"

      # Verify Prometheus
      echo "=== Verifying Prometheus ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus" -b | grep -q "Running" && echo "✓ Prometheus is running" || echo "✗ Prometheus is not running"

      # Test Loki API
      echo "=== Testing Loki API ==="
      ansible k8s_master -i inventory.ini -m shell -a "kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never --command -- curl -s -o /dev/null -w '%{http_code}' http://loki.monitoring.svc:3100/ready" -b | grep -q "200" && echo "✓ Loki API is responding" || echo "✗ Loki API is not responding"

      echo "=== Monitoring Stack Verification Complete ==="
  needs:
    - deploy:prometheus
    - deploy:grafana
    - deploy:loki
    - deploy:promtail
    - deploy:exporters
  allow_failure: true
  when: on_success

# Notify Success
notify:success:
  stage: notify
  image: alpine:3.18
  script:
    - echo "Monitoring stack deployed successfully"
    - wget -q -O- --post-data="Monitoring stack deployed" "${SLACK_WEBHOOK_URL}" || true
  needs:
    - verify:monitoring

# Notify Failure
notify:failure:
  stage: notify
  image: alpine:3.18
  script:
    - echo "Monitoring stack deployment failed"
    - wget -q -O- --post-data="Monitoring stack failed" "${SLACK_WEBHOOK_URL}" || true
  when: on_failure
